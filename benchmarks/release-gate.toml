version = 1

# Production release policy. These values are the release gate, not examples.
# Changing one requires the same review as changing the harness that enforces it.
[production]
project_head_reapply_max_ms = 1000
project_rebuild_max_seconds = 21600
interpret_min_blocks_per_hour = 500000
interpret_walk_deadline_multiplier = 2
interpret_walk_max_seconds = 21600
interpret_max_peak_rss_mib = 32768
interpret_state_cache_entries = 65536
interpret_min_walk_blocks = 100000
dense_min_raw_logs_per_1000_blocks = 8000
project_min_name_current_rows = 3000000
api_target_qps = 2000
api_min_achieved_qps = 1950
api_duration_seconds = 60
api_warmup_seconds = 10
api_corpus_size = 10000
api_min_specialized_corpus_size = 1000
api_min_name_current_rows = 3000000
api_min_address_names_current_rows = 3000000
api_min_success_percent = 100.0
api_records_min_populated_percent = 1.0
api_cursor_seed_count = 128
api_cursor_weight_percent = 10
api_validation_sample_every = 100
api_require_populated_probes = true
api_require_cursor_variants = true
api_require_resolver_cursor_variant = true

