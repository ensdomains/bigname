name: Docker Image

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write
  actions: read

concurrency:
  group: docker-publish-${{ github.ref_name }}
  cancel-in-progress: false

env:
  RUST_VERSION: 1.98.0

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # workflow_run never fires for tags, so the tagged commit's own CI result
      # is read here rather than rebuilding CI's gates in this job.
      - name: Require a released commit on main or a release branch with green CI
        id: commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag $TAG is not vMAJOR.MINOR.PATCH[-PRERELEASE]"
            exit 1
          fi
          sha="$(git rev-parse HEAD)"
          released=false
          for branch in origin/main $(git for-each-ref --format='%(refname:short)' refs/remotes/origin/release/); do
            if git merge-base --is-ancestor "$sha" "$branch"; then released=true; fi
          done
          if [[ "$released" != true ]]; then
            echo "::error::tag $TAG points at $sha, which is not on main or a release/* branch"
            exit 1
          fi
          # A tag pushed right after a merge can race main's own CI run.
          deadline=$((SECONDS + 3600))
          # An empty listing or a failed query is retried until the deadline.
          while :; do
            if runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$sha&per_page=100" \
              --jq '[.workflow_runs[] | {status, conclusion}]')"; then
              if jq -e 'any(.[]; .conclusion == "success")' <<<"$runs" >/dev/null; then
                break
              fi
              if ! jq -e 'length == 0 or any(.[]; .status != "completed")' <<<"$runs" >/dev/null; then
                echo "::error::no successful CI run for $sha"
                exit 1
              fi
            fi
            if ((SECONDS >= deadline)); then
              echo "::error::no successful CI run for $sha"
              exit 1
            fi
            sleep 30
          done
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Resolve image metadata
        id: image
        shell: bash
        env:
          HEAD_SHA: ${{ steps.commit.outputs.sha }}
          TAG: ${{ github.ref_name }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          {
            echo "name=$image"
            echo "tags<<EOF"
            echo "$image:$TAG"
            echo "$image:${HEAD_SHA::7}"
            [[ "$TAG" == *-* ]] || echo "$image:latest"
            echo "EOF"
            echo "labels<<EOF"
            echo "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY"
            echo "org.opencontainers.image.revision=$HEAD_SHA"
            echo "org.opencontainers.image.version=$TAG"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A rerun of an older run for a tag that has since moved must not
      # publish the old commit under that tag.
      - name: Require the tag to still point at this commit
        shell: bash
        env:
          HEAD_SHA: ${{ steps.commit.outputs.sha }}
          TAG: ${{ github.ref_name }}
        run: |
          refs="$(git ls-remote --tags origin "refs/tags/$TAG" "refs/tags/$TAG^{}")"
          current="$(awk -v peeled="refs/tags/$TAG^{}" '$2 == peeled { print $1; found = 1 } END { if (!found) exit 1 }' <<<"$refs" \
            || awk -v want="refs/tags/$TAG" '$2 == want { print $1 }' <<<"$refs")"
          if [[ "$current" != "$HEAD_SHA" ]]; then
            echo "::error::tag $TAG now points at ${current:-nothing}, not $HEAD_SHA"
            exit 1
          fi

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          build-args: |
            RUST_VERSION=${{ env.RUST_VERSION }}
            BIGNAME_BUILD_SHA=${{ steps.commit.outputs.sha }}
          tags: ${{ steps.image.outputs.tags }}
          labels: ${{ steps.image.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
