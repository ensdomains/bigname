name: CI

# Probe branch only: one job that times the long resolver DNS name tests under the runner
# image's build profile. The image builds with `cargo build --locked --release --workspace
# --bins` (Dockerfile:53 and :72), with no RUSTFLAGS, target-cpu or [profile.release] settings.

on:
  push:
    branches:
      - "ci/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: 1.98.0

jobs:
  release_probe:
    name: release probe (long resolver DNS name)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bigname
          POSTGRES_USER: bigname
          POSTGRES_PASSWORD: bigname
          POSTGRES_INITDB_ARGS: "--set=max_connections=300 --set=jit=off --set=log_lock_waits=on"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bigname -d bigname"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BIGNAME_TEST_DATABASE_URL: postgres://bigname:bigname@127.0.0.1:5432/bigname
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Build the test binary (release)
        run: >-
          time ./scripts/test-db -- cargo test --locked --release --no-run
          -p bigname-interpret --lib
          --features bigname-adapters/test-activation,bigname-storage/test-support

      - name: Run the long resolver DNS name tests (release)
        run: >-
          time ./scripts/test-db -- cargo test --locked --release
          -p bigname-interpret --lib
          --features bigname-adapters/test-activation,bigname-storage/test-support
          long_resolver_dns_name -- --nocapture --test-threads=1
