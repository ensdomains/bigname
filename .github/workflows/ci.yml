name: CI

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTC_WRAPPER: sccache
  RUST_VERSION: 1.93.1
  FOUNDRY_VERSION: v1.7.1
  SCCACHE_GHA_ENABLED: "true"

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy,rustfmt

      - name: Set up sccache
        id: sccache
        continue-on-error: true
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Fall back without sccache
        if: steps.sccache.outcome != 'success'
        run: echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --check

      - name: cargo fmt (e2e workspace)
        run: cargo fmt --manifest-path tests/e2e/Cargo.toml -- --check

      - name: Rust source size ratchet
        env:
          # merge_group.base_ref keeps the allowance ratchet enforced at the
          # queue's final gate, where strict up-to-date no longer forces a
          # fresh pull_request run against merge-time main.
          BASE_REF: ${{ github.base_ref || github.event.merge_group.base_ref }}
        run: |
          BASE_REF="${BASE_REF#refs/heads/}"
          if { [ "$GITHUB_EVENT_NAME" = "pull_request" ] || [ "$GITHUB_EVENT_NAME" = "merge_group" ]; } && [ -n "$BASE_REF" ]; then
            git fetch --no-tags --depth=1 origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
            ./scripts/check-rust-file-size --base-ref "refs/remotes/origin/${BASE_REF}"
          else
            ./scripts/check-rust-file-size
          fi

      - name: Install ripgrep
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ripgrep

      - name: API/storage query ownership
        run: |
          ./scripts/check-query-ownership
          (cd scripts && bash test-query-ownership)

      - name: Migration version guard
        run: ./scripts/check-migration-versions

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang libclang-dev

      - name: cargo check
        run: cargo check --workspace --all-targets --all-features

      - name: cargo check (e2e workspace)
        run: cargo check --manifest-path tests/e2e/Cargo.toml --locked --all-targets

      - name: cargo clippy (strict workspace packages)
        run: cargo clippy --workspace --all-targets --all-features --exclude bigname-adapters --no-deps -- -D warnings

      # The adapter crate still carries pre-existing warning classes. Deny
      # every other warning here so new lint classes cannot silently widen the
      # baseline while those targeted classes are paid down.
      - name: cargo clippy (adapter warning-class baseline)
        run: >-
          cargo clippy -p bigname-adapters --all-targets --all-features --
          -D warnings
          -A clippy::unusual-byte-groupings
          -A clippy::too-many-arguments
          -A clippy::needless-question-mark
          -A clippy::collapsible-if
          -A clippy::needless-borrows-for-generic-args
          -A clippy::explicit-auto-deref
          -A clippy::needless-borrow
          -A clippy::filter-map-bool-then
          -A clippy::match-like-matches-macro
          -A clippy::borrow-deref-ref
          -A clippy::needless-option-as-deref
          -A clippy::needless-return
          -A clippy::redundant-closure
          -A clippy::bool-assert-comparison
          -A clippy::cloned-ref-to-slice-refs

      - name: cargo clippy (e2e workspace)
        run: cargo clippy --manifest-path tests/e2e/Cargo.toml --locked --all-targets -- -D warnings

  schema_v2:
    name: test (schema v2)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bigname
          POSTGRES_USER: bigname
          POSTGRES_PASSWORD: bigname
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bigname -d bigname"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BIGNAME_TEST_DATABASE_URL: postgres://bigname:bigname@127.0.0.1:5432/bigname
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Apply and verify schema v2
        run: ./schema-v2/apply-check.sh

  test_shard:
    name: test (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            packages: "-p bigname-api"
          - name: core
            packages: >-
              -p bigname-domain
              -p bigname-storage
              -p bigname-manifests
              -p bigname-adapters
              -p bigname-test-support
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bigname
          POSTGRES_USER: bigname
          POSTGRES_PASSWORD: bigname
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bigname -d bigname"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BIGNAME_DATABASE_URL: postgres://bigname:bigname@127.0.0.1:5432/bigname
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang libclang-dev

      - name: Set up sccache
        id: sccache
        continue-on-error: true
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Fall back without sccache
        if: steps.sccache.outcome != 'success'
        run: echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: cargo test
        run: cargo test ${{ matrix.packages }} --all-features

  phase_runner_shard_1:
    name: test (phase-runner shard 1/3)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bigname
          POSTGRES_USER: bigname
          POSTGRES_PASSWORD: bigname
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bigname -d bigname"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BIGNAME_TEST_DATABASE_URL: postgres://bigname:bigname@127.0.0.1:5432/bigname
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang libclang-dev

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.143

      - name: Set up sccache
        id: sccache
        continue-on-error: true
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Fall back without sccache
        if: steps.sccache.outcome != 'success'
        run: echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: cargo nextest (slice 1/3)
        run: >-
          ./scripts/test-db -- cargo nextest run
          -p phase-runner
          -p bigname-ingest
          -p bigname-interpret
          -p bigname-content-hash
          -p bigname-benchmark-gate
          -p bigname-lookup
          -p bigname-project
          -p bigname-metrics
          --all-features
          --partition slice:1/3

      - name: cargo test (doctests)
        run: >-
          ./scripts/test-db -- cargo test
          -p phase-runner
          -p bigname-ingest
          -p bigname-interpret
          -p bigname-content-hash
          -p bigname-benchmark-gate
          -p bigname-lookup
          -p bigname-project
          -p bigname-metrics
          --all-features
          --doc

  phase_runner_shard_2:
    name: test (phase-runner shard 2/3)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bigname
          POSTGRES_USER: bigname
          POSTGRES_PASSWORD: bigname
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bigname -d bigname"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BIGNAME_TEST_DATABASE_URL: postgres://bigname:bigname@127.0.0.1:5432/bigname
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang libclang-dev

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.143

      - name: Set up sccache
        id: sccache
        continue-on-error: true
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Fall back without sccache
        if: steps.sccache.outcome != 'success'
        run: echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: cargo nextest (slice 2/3)
        run: >-
          ./scripts/test-db -- cargo nextest run
          -p phase-runner
          -p bigname-ingest
          -p bigname-interpret
          -p bigname-content-hash
          -p bigname-benchmark-gate
          -p bigname-lookup
          -p bigname-project
          -p bigname-metrics
          --all-features
          --partition slice:2/3

  phase_runner_shard_3:
    name: test (phase-runner shard 3/3)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bigname
          POSTGRES_USER: bigname
          POSTGRES_PASSWORD: bigname
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bigname -d bigname"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BIGNAME_TEST_DATABASE_URL: postgres://bigname:bigname@127.0.0.1:5432/bigname
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang libclang-dev

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.143

      - name: Set up sccache
        id: sccache
        continue-on-error: true
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Fall back without sccache
        if: steps.sccache.outcome != 'success'
        run: echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: cargo nextest (slice 3/3)
        run: >-
          ./scripts/test-db -- cargo nextest run
          -p phase-runner
          -p bigname-ingest
          -p bigname-interpret
          -p bigname-content-hash
          -p bigname-benchmark-gate
          -p bigname-lookup
          -p bigname-project
          -p bigname-metrics
          --all-features
          --partition slice:3/3

  phase_runner:
    name: test (phase-runner)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - phase_runner_shard_1
      - phase_runner_shard_2
      - phase_runner_shard_3
    if: always()
    steps:
      - name: Check phase-runner shards
        run: |
          if [ "${{ needs.phase_runner_shard_1.result }}" != "success" ] ||
             [ "${{ needs.phase_runner_shard_2.result }}" != "success" ] ||
             [ "${{ needs.phase_runner_shard_3.result }}" != "success" ]; then
            echo "phase-runner shard 1/3: ${{ needs.phase_runner_shard_1.result }}"
            echo "phase-runner shard 2/3: ${{ needs.phase_runner_shard_2.result }}"
            echo "phase-runner shard 3/3: ${{ needs.phase_runner_shard_3.result }}"
            exit 1
          fi

  e2e:
    name: test (e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bigname
          POSTGRES_USER: bigname
          POSTGRES_PASSWORD: bigname
          POSTGRES_INITDB_ARGS: "--set=max_connections=300"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bigname -d bigname"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BIGNAME_DATABASE_URL: postgres://bigname:bigname@127.0.0.1:5432/bigname
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang libclang-dev

      - name: Install foundry (anvil)
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}

      - name: Set up sccache
        id: sccache
        continue-on-error: true
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Fall back without sccache
        if: steps.sccache.outcome != 'success'
        run: echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Sync pinned upstream checkouts
        run: |
          scripts/sync-refs
          scripts/sync-refs --check

      - name: Prebuild phase-runner
        run: cargo build --locked --package phase-runner --bin phase-runner

      - name: Run e2e passed-count gate
        env:
          BIGNAME_E2E_TEST_THREADS: "8"
        run: tests/e2e/run-gate

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - schema_v2
      - test_shard
      - phase_runner
      - e2e
    if: always()
    steps:
      - name: Check test shards
        run: |
          if [ "${{ needs.schema_v2.result }}" != "success" ]; then
            echo "schema v2 finished with result: ${{ needs.schema_v2.result }}"
            exit 1
          fi
          if [ "${{ needs.test_shard.result }}" != "success" ]; then
            echo "test shards finished with result: ${{ needs.test_shard.result }}"
            exit 1
          fi
          if [ "${{ needs.phase_runner.result }}" != "success" ]; then
            echo "phase-runner finished with result: ${{ needs.phase_runner.result }}"
            exit 1
          fi
          if [ "${{ needs.e2e.result }}" != "success" ]; then
            echo "e2e finished with result: ${{ needs.e2e.result }}"
            exit 1
          fi

  artifacts-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bigname
          POSTGRES_USER: bigname
          POSTGRES_PASSWORD: bigname
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bigname -d bigname"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BIGNAME_DATABASE_URL: postgres://bigname:bigname@127.0.0.1:5432/bigname
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Set up sccache
        id: sccache
        continue-on-error: true
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Fall back without sccache
        if: steps.sccache.outcome != 'success'
        run: echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Fetch smoke dependencies
        run: |
          cargo fetch --locked
          docker pull caddy:2-alpine

      - name: Sync upstream refs
        run: scripts/sync-refs

      - name: Initialize phase schema
        run: cargo run --locked -p phase-runner --bin phase-runner -- init-schema

      - name: release smoke gate (no network)
        run: ./scripts/release-smoke --no-network

      - name: rollback smoke gate (no network)
        run: ./scripts/rollback-smoke --no-network

  manager-graphql-compat:
    # Guards that bigname's GraphQL schema still serves every field the ENS
    # Manager's operations ask for. Validates the Manager's committed operation
    # documents (pulled from apps-monorepo) against bigname's committed SDL
    # fixture. This is a subset check ("does bigname serve what the Manager
    # needs"), not a schema-to-schema diff — bigname is deliberately a subset,
    # so a diff would be all noise. A breaking schema change (removed/renamed
    # field the Manager reads) fails this job; adding or removing a
    # bigname-private field the Manager never reads does not.
    name: Manager GraphQL compat
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # GitHub withholds repository secrets (except GITHUB_TOKEN) from
    # fork-originated pull_request runs, so the private apps-monorepo checkout
    # below cannot authenticate on external-fork PRs. Skip the job cleanly for
    # those instead of failing at checkout; it still runs for same-repo
    # branches and on every push to main, so a fork-merged regression is
    # caught on main immediately. (Skipped jobs satisfy required checks, so
    # making this check required would not block external contributors.)
    # merge_group runs are skipped for the same reason: a queued fork PR's
    # unmerged code would otherwise execute with the private-repo token before
    # any merge happens. Same-repo changes were checked at PR time; queued
    # fork changes stay covered by the post-merge run on main, unchanged.
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - name: Checkout bigname
        uses: actions/checkout@v4

      - name: Checkout Manager operation documents
        uses: actions/checkout@v4
        with:
          repository: ensdomains/apps-monorepo
          # Pinned deliberately so bigname CI does not flake red on every
          # Manager edit; bump this when the Manager's indexer documents change.
          ref: 759860f5acc62ea287b0feefa23c0d17aeb862a9
          # apps-monorepo is private; this checkout needs a fine-grained PAT /
          # GitHub App token with contents:read on ensdomains/apps-monorepo.
          token: ${{ secrets.APPS_MONOREPO_READ_TOKEN }}
          path: apps-monorepo
          # Only the operation documents are needed — keep the checkout minimal.
          sparse-checkout: packages/indexer/documents
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate Manager operations against bigname schema
        run: |
          npx -y -p @graphql-inspector/cli@6.0.8 -p graphql@16.14.2 graphql-inspector validate \
            'apps-monorepo/packages/indexer/documents/**/*.graphql' \
            apps/api/src/tests/fixtures/subgraph_schema.graphql
