name: CI

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # A newer push replaces an older run of the same pull request. Runs on main
  # are left to finish, because they are the only runs that save the Cargo
  # caches every pull request restores (see the cache note below). A main run
  # cancelled part-way saves nothing, and the next pull requests compile cold.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Cache note. GitHub keeps 10 GB of Actions cache per repository and evicts the
# least recently used entries past that. A pull request can restore entries
# saved by its own ref or by main, never by another pull request or by a merge
# queue ref. So the entries worth keeping are the ones main saves.
#
# sccache is deliberately not used. Its GitHub backend stores one cache entry
# per compiled crate and makes one cache API call per lookup and per write,
# about ten thousand calls per run. That used up the repository's cache API
# rate limit: nearly every sccache write failed, and the large keyed caches
# below then failed with "You've hit a rate limit", "Unable to reserve cache"
# and 429 on restore, which left the e2e shards and the container-shutdown job
# compiling cold. The keyed Cargo caches cover the same dependencies with one
# entry per job.
env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: 1.98.0
  FOUNDRY_VERSION: v1.7.1

jobs:
  validation:
    name: Select CI validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      reuse: ${{ steps.plan.outputs.reuse }}
    steps:
      - uses: actions/checkout@v4
      - name: Find successful queue validation for this commit
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci-check-plan.py

  static:
    needs: [validation]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy,rustfmt

      # Only main saves this cache (see the cache note at the top). Pull requests
      # and merge queue runs restore main's entry, falling back to main's entry
      # for an older Cargo.lock, and save nothing: their copies were invisible
      # to every other run and pushed main's entries out of the 10 GB limit.
      - name: Cache cargo artifacts
        id: cargo_cache
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: cargo fmt
        if: needs.validation.outputs.reuse != 'true'
        run: cargo fmt --check

      - name: cargo fmt (e2e workspace)
        if: needs.validation.outputs.reuse != 'true'
        run: cargo fmt --manifest-path tests/e2e/Cargo.toml -- --check

      - name: Test Rust source size classifier
        if: needs.validation.outputs.reuse != 'true'
        run: scripts/test-rust-file-size

      - name: Reference sync selection tests
        if: needs.validation.outputs.reuse != 'true'
        run: scripts/test-sync-refs

      - name: Rust source size ratchet
        if: needs.validation.outputs.reuse != 'true'
        env:
          # merge_group.base_ref keeps the allowance ratchet enforced at the
          # queue's final gate, where strict up-to-date no longer forces a
          # fresh pull_request run against merge-time main.
          BASE_REF: ${{ github.base_ref || github.event.merge_group.base_ref }}
        run: |
          BASE_REF="${BASE_REF#refs/heads/}"
          if { [ "$GITHUB_EVENT_NAME" = "pull_request" ] || [ "$GITHUB_EVENT_NAME" = "merge_group" ]; } && [ -n "$BASE_REF" ]; then
            git fetch --no-tags --depth=1 origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
            ./scripts/check-rust-file-size --base-ref "refs/remotes/origin/${BASE_REF}"
          else
            ./scripts/check-rust-file-size
          fi

      - name: Prometheus rule fixtures parse with promtool
        if: needs.validation.outputs.reuse != 'true'
        env:
          PROMETHEUS_VERSION: 3.13.2
          PROMETHEUS_SHA256: 0e8c4d46101bd025ea8265e377d2caabc57f488fc1be1c367f37db69ea41be6f
        run: |
          archive="$RUNNER_TEMP/prometheus-${PROMETHEUS_VERSION}.linux-amd64.tar.gz"
          install_dir="$RUNNER_TEMP/prometheus-${PROMETHEUS_VERSION}.linux-amd64"
          curl --fail --location --retry 3 \
            --output "$archive" \
            "https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}/prometheus-${PROMETHEUS_VERSION}.linux-amd64.tar.gz"
          printf '%s  %s\n' "$PROMETHEUS_SHA256" "$archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          promtool="$install_dir/promtool"
          "$promtool" --version
          "$promtool" --version | grep -F "version ${PROMETHEUS_VERSION}"
          (
            cd ops/monitoring/prometheus
            "$promtool" check rules phase-runner-alerts.yml
            "$promtool" check config phase-runner.yml
            "$promtool" test rules phase-runner-alerts.test.yml
          )

      - name: Install ripgrep
        if: needs.validation.outputs.reuse != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ripgrep

      - name: API/storage query ownership
        if: needs.validation.outputs.reuse != 'true'
        run: |
          ./scripts/check-query-ownership
          (cd scripts && bash test-query-ownership)

      - name: Migration version guard
        if: needs.validation.outputs.reuse != 'true'
        run: ./scripts/check-migration-versions

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang libclang-dev

      # Exercise the test helpers without enabling the optional direct Reth reader.
      - name: cargo check
        if: needs.validation.outputs.reuse != 'true'
        run: cargo check --workspace --all-targets --features bigname-adapters/test-activation,bigname-storage/test-support

      - name: cargo check (e2e workspace)
        if: needs.validation.outputs.reuse != 'true'
        run: cargo check --manifest-path tests/e2e/Cargo.toml --locked --all-targets

      - name: cargo clippy (strict workspace packages)
        if: needs.validation.outputs.reuse != 'true'
        run: cargo clippy --workspace --all-targets --features bigname-adapters/test-activation,bigname-storage/test-support --exclude bigname-adapters --no-deps -- -D warnings

      # The adapter crate still carries pre-existing warning classes. Deny
      # every other warning here so new lint classes cannot silently widen the
      # baseline while those targeted classes are paid down.
      - name: cargo clippy (adapter warning-class baseline)
        if: needs.validation.outputs.reuse != 'true'
        run: >-
          cargo clippy -p bigname-adapters --all-targets --features test-activation --
          -D warnings
          -A clippy::unusual-byte-groupings
          -A clippy::too-many-arguments
          -A clippy::needless-question-mark
          -A clippy::collapsible-if
          -A clippy::needless-borrows-for-generic-args
          -A clippy::explicit-auto-deref
          -A clippy::needless-borrow
          -A clippy::filter-map-bool-then
          -A clippy::match-like-matches-macro
          -A clippy::borrow-deref-ref
          -A clippy::needless-option-as-deref
          -A clippy::needless-return
          -A clippy::redundant-closure
          -A clippy::bool-assert-comparison
          -A clippy::cloned-ref-to-slice-refs

      - name: cargo clippy (e2e workspace)
        if: needs.validation.outputs.reuse != 'true'
        run: cargo clippy --manifest-path tests/e2e/Cargo.toml --locked --all-targets -- -D warnings

      - name: CI reuse decision tests
        if: needs.validation.outputs.reuse != 'true'
        run: |
          python3 scripts/tests/test-ci-check-plan.py
          python3 scripts/tests/test-container-shutdown-build.py

      - name: Warm check dependencies
        if: needs.validation.outputs.reuse == 'true' && steps.cargo_cache.outputs.cache-hit != 'true'
        run: |
          cargo check --workspace --all-targets --features bigname-adapters/test-activation,bigname-storage/test-support
          cargo check --manifest-path tests/e2e/Cargo.toml --locked --all-targets

  site:
    needs: [validation]
    # The landing page and API reference are a static site with no build step
    # (site/README.md). Run its static guards and behaviour tests, then keep
    # the exact files as an artifact; hosting is provisioned separately. The
    # API crate's site_pages tests hold the reference to the router.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check the site
        if: needs.validation.outputs.reuse != 'true'
        run: scripts/check-site

      # The runner's preinstalled Node; the tests use only node:test and node:assert.
      - name: Site behaviour tests
        if: needs.validation.outputs.reuse != 'true'
        run: node --test scripts/tests/site.test.mjs

      # The OpenAPI edge regression's failure path, with a stub docker.
      - name: OpenAPI edge regression cleanup
        if: needs.validation.outputs.reuse != 'true'
        run: scripts/tests/openapi-edge-smoke-cleanup

      - name: Upload the site
        uses: actions/upload-artifact@v7
        with:
          name: site-${{ github.run_id }}-${{ github.run_attempt }}
          path: site/
          retention-days: 7
          if-no-files-found: error

  schema_v2:
    needs: [validation]
    if: needs.validation.outputs.reuse != 'true'
    name: test (schema v2)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bigname
          POSTGRES_USER: bigname
          POSTGRES_PASSWORD: bigname
          POSTGRES_INITDB_ARGS: "--set=jit=off"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bigname -d bigname"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BIGNAME_TEST_DATABASE_URL: postgres://bigname:bigname@127.0.0.1:5432/bigname
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Apply and verify schema v2
        run: ./schema-v2/apply-check.sh

  test_shard:
    needs: [validation]
    name: test (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: core
            packages: >-
              -p bigname-domain
              -p bigname-storage
              -p bigname-manifests
              -p bigname-adapters
              -p bigname-test-support
            postgres_initdb_args: "--set=jit=off"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bigname
          POSTGRES_USER: bigname
          POSTGRES_PASSWORD: bigname
          POSTGRES_INITDB_ARGS: ${{ matrix.postgres_initdb_args }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bigname -d bigname"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BIGNAME_DATABASE_URL: postgres://bigname:bigname@127.0.0.1:5432/bigname
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang libclang-dev

      # Only main saves this cache (see the cache note at the top). Pull requests
      # and merge queue runs restore main's entry, falling back to main's entry
      # for an older Cargo.lock, and save nothing: their copies were invisible
      # to every other run and pushed main's entries out of the 10 GB limit.
      - name: Cache cargo artifacts
        id: cargo_cache
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Sync pinned upstream checkouts
        if: (matrix.name == 'core') && (needs.validation.outputs.reuse != 'true' || steps.cargo_cache.outputs.cache-hit != 'true')
        run: |
          scripts/sync-refs
          scripts/sync-refs --check

      - name: cargo test
        if: needs.validation.outputs.reuse != 'true'
        run: cargo test ${{ matrix.packages }} --features bigname-adapters/test-activation,bigname-storage/test-support

      - name: Warm core test dependencies
        if: needs.validation.outputs.reuse == 'true' && steps.cargo_cache.outputs.cache-hit != 'true'
        run: cargo test --no-run ${{ matrix.packages }} --features bigname-adapters/test-activation,bigname-storage/test-support

  api_shard:
    needs: [validation]
    name: test (api shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.validation.outputs.reuse == 'true' && '[1]' || '[1,2]') }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bigname
          POSTGRES_USER: bigname
          POSTGRES_PASSWORD: bigname
          # Preserve the production-like JIT setting used by the API suite.
          POSTGRES_INITDB_ARGS: ""
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bigname -d bigname"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BIGNAME_DATABASE_URL: postgres://bigname:bigname@127.0.0.1:5432/bigname
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang libclang-dev

      # Only main saves this cache (see the cache note at the top). Pull requests
      # and merge queue runs restore main's entry, falling back to main's entry
      # for an older Cargo.lock, and save nothing: their copies were invisible
      # to every other run and pushed main's entries out of the 10 GB limit.
      - name: Cache cargo artifacts
        id: cargo_cache
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' && matrix.shard == 1 }}

      - name: Install cargo-nextest
        if: needs.validation.outputs.reuse != 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.143

      - name: cargo nextest (API partition)
        if: needs.validation.outputs.reuse != 'true'
        run: >-
          cargo nextest run --locked -p bigname-api
          --features bigname-adapters/test-activation,bigname-storage/test-support
          --no-fail-fast
          --partition hash:${{ matrix.shard }}/2

      - name: Warm API test dependencies
        if: needs.validation.outputs.reuse == 'true' && steps.cargo_cache.outputs.cache-hit != 'true'
        run: cargo test --locked --no-run -p bigname-api --features bigname-adapters/test-activation,bigname-storage/test-support

  api:
    name: test (api)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - validation
      - api_shard
    if: always()
    steps:
      - name: Check API shards
        run: |
          if [ "${{ needs.api_shard.result }}" != "success" ]; then
            echo "API shards finished with result: ${{ needs.api_shard.result }}"
            exit 1
          fi

  phase_runner_shard_1:
    needs: [validation]
    if: needs.validation.outputs.reuse != 'true'
    name: test (phase-runner shard 1/3)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bigname
          POSTGRES_USER: bigname
          POSTGRES_PASSWORD: bigname
          # These small correctness fixtures trigger expensive JIT compilation;
          # production and the separate benchmark gates retain their own settings.
          POSTGRES_INITDB_ARGS: "--set=max_connections=300 --set=jit=off"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bigname -d bigname"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BIGNAME_TEST_DATABASE_URL: postgres://bigname:bigname@127.0.0.1:5432/bigname
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang libclang-dev

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.143

      - name: Compute phase-runner dependency-cache key
        id: phase_runner_cache_key
        run: |
          root_lock_sha="$(sha256sum Cargo.lock | cut -d' ' -f1)"
          e2e_lock_sha="$(sha256sum tests/e2e/Cargo.lock | cut -d' ' -f1)"
          prefix="v1-rust-${RUST_VERSION}-${root_lock_sha}-${e2e_lock_sha}"
          runner_arch="$(printf '%s' "$RUNNER_ARCH" | tr '[:upper:]' '[:lower:]')"
          primary="${prefix}-phase-runner-${RUNNER_OS}-${runner_arch}"
          echo "prefix=$prefix" >>"$GITHUB_OUTPUT"
          echo "primary=$primary" >>"$GITHUB_OUTPUT"
          echo "phase-runner dependency-cache primary key: $primary"

      # Restore only. `build (e2e phase-runner)` is the one job that saves this
      # key, so the entry always holds the dependencies of the plain
      # `cargo build -p phase-runner` that the e2e shards and the
      # container-shutdown job repeat. When this shard won the save instead, the
      # entry held this shard's all-features test build under the same key.
      - name: Cache phase-runner Cargo dependencies
        id: phase_runner_cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: ${{ steps.phase_runner_cache_key.outputs.prefix }}
          shared-key: phase-runner
          add-job-id-key: false
          add-rust-environment-hash-key: false
          workspaces: ". -> target"
          cache-workspace-crates: false
          save-if: false

      - name: Report phase-runner dependency cache
        env:
          CACHE_HIT: ${{ steps.phase_runner_cache.outputs.cache-hit }}
          CACHE_PRIMARY_KEY: ${{ steps.phase_runner_cache_key.outputs.primary }}
        run: |
          echo "phase-runner dependency-cache primary key: $CACHE_PRIMARY_KEY"
          echo "phase-runner dependency-cache hit: $CACHE_HIT"
          {
            echo "### phase-runner dependency cache"
            echo
            echo "- Primary key: \`$CACHE_PRIMARY_KEY\`"
            echo "- Exact hit: \`$CACHE_HIT\`"
          } >>"$GITHUB_STEP_SUMMARY"

      - name: cargo nextest (slice 1/3)
        run: >-
          ./scripts/test-db -- cargo nextest run
          -p phase-runner
          -p bigname-ingest
          -p bigname-interpret
          -p bigname-content-hash
          -p bigname-benchmark-gate
          -p bigname-lookup
          -p bigname-project
          -p bigname-metrics
          --features bigname-adapters/test-activation,bigname-storage/test-support
          --no-fail-fast
          --partition slice:1/3

      - name: cargo test (doctests)
        run: >-
          ./scripts/test-db -- cargo test
          -p phase-runner
          -p bigname-ingest
          -p bigname-interpret
          -p bigname-content-hash
          -p bigname-benchmark-gate
          -p bigname-lookup
          -p bigname-project
          -p bigname-metrics
          --features bigname-adapters/test-activation,bigname-storage/test-support
          --doc

  phase_runner_shard_2:
    needs: [validation]
    if: needs.validation.outputs.reuse != 'true'
    name: test (phase-runner shard 2/3)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bigname
          POSTGRES_USER: bigname
          POSTGRES_PASSWORD: bigname
          # These small correctness fixtures trigger expensive JIT compilation;
          # production and the separate benchmark gates retain their own settings.
          POSTGRES_INITDB_ARGS: "--set=max_connections=300 --set=jit=off"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bigname -d bigname"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BIGNAME_TEST_DATABASE_URL: postgres://bigname:bigname@127.0.0.1:5432/bigname
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang libclang-dev

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.143

      - name: Compute phase-runner dependency-cache key
        id: phase_runner_cache_key
        run: |
          root_lock_sha="$(sha256sum Cargo.lock | cut -d' ' -f1)"
          e2e_lock_sha="$(sha256sum tests/e2e/Cargo.lock | cut -d' ' -f1)"
          prefix="v1-rust-${RUST_VERSION}-${root_lock_sha}-${e2e_lock_sha}"
          runner_arch="$(printf '%s' "$RUNNER_ARCH" | tr '[:upper:]' '[:lower:]')"
          primary="${prefix}-phase-runner-${RUNNER_OS}-${runner_arch}"
          echo "prefix=$prefix" >>"$GITHUB_OUTPUT"
          echo "primary=$primary" >>"$GITHUB_OUTPUT"
          echo "phase-runner dependency-cache primary key: $primary"

      # Restore only. `build (e2e phase-runner)` is the one job that saves this
      # key, so the entry always holds the dependencies of the plain
      # `cargo build -p phase-runner` that the e2e shards and the
      # container-shutdown job repeat. When this shard won the save instead, the
      # entry held this shard's all-features test build under the same key.
      - name: Cache phase-runner Cargo dependencies
        id: phase_runner_cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: ${{ steps.phase_runner_cache_key.outputs.prefix }}
          shared-key: phase-runner
          add-job-id-key: false
          add-rust-environment-hash-key: false
          workspaces: ". -> target"
          cache-workspace-crates: false
          save-if: false

      - name: Report phase-runner dependency cache
        env:
          CACHE_HIT: ${{ steps.phase_runner_cache.outputs.cache-hit }}
          CACHE_PRIMARY_KEY: ${{ steps.phase_runner_cache_key.outputs.primary }}
        run: |
          echo "phase-runner dependency-cache primary key: $CACHE_PRIMARY_KEY"
          echo "phase-runner dependency-cache hit: $CACHE_HIT"
          {
            echo "### phase-runner dependency cache"
            echo
            echo "- Primary key: \`$CACHE_PRIMARY_KEY\`"
            echo "- Exact hit: \`$CACHE_HIT\`"
          } >>"$GITHUB_STEP_SUMMARY"

      - name: cargo nextest (slice 2/3)
        run: >-
          ./scripts/test-db -- cargo nextest run
          -p phase-runner
          -p bigname-ingest
          -p bigname-interpret
          -p bigname-content-hash
          -p bigname-benchmark-gate
          -p bigname-lookup
          -p bigname-project
          -p bigname-metrics
          --features bigname-adapters/test-activation,bigname-storage/test-support
          --no-fail-fast
          --partition slice:2/3

  phase_runner_shard_3:
    needs: [validation]
    if: needs.validation.outputs.reuse != 'true'
    name: test (phase-runner shard 3/3)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bigname
          POSTGRES_USER: bigname
          POSTGRES_PASSWORD: bigname
          # These small correctness fixtures trigger expensive JIT compilation;
          # production and the separate benchmark gates retain their own settings.
          POSTGRES_INITDB_ARGS: "--set=max_connections=300 --set=jit=off"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bigname -d bigname"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BIGNAME_TEST_DATABASE_URL: postgres://bigname:bigname@127.0.0.1:5432/bigname
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang libclang-dev

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.143

      - name: Compute phase-runner dependency-cache key
        id: phase_runner_cache_key
        run: |
          root_lock_sha="$(sha256sum Cargo.lock | cut -d' ' -f1)"
          e2e_lock_sha="$(sha256sum tests/e2e/Cargo.lock | cut -d' ' -f1)"
          prefix="v1-rust-${RUST_VERSION}-${root_lock_sha}-${e2e_lock_sha}"
          runner_arch="$(printf '%s' "$RUNNER_ARCH" | tr '[:upper:]' '[:lower:]')"
          primary="${prefix}-phase-runner-${RUNNER_OS}-${runner_arch}"
          echo "prefix=$prefix" >>"$GITHUB_OUTPUT"
          echo "primary=$primary" >>"$GITHUB_OUTPUT"
          echo "phase-runner dependency-cache primary key: $primary"

      # Restore only. `build (e2e phase-runner)` is the one job that saves this
      # key, so the entry always holds the dependencies of the plain
      # `cargo build -p phase-runner` that the e2e shards and the
      # container-shutdown job repeat. When this shard won the save instead, the
      # entry held this shard's all-features test build under the same key.
      - name: Cache phase-runner Cargo dependencies
        id: phase_runner_cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: ${{ steps.phase_runner_cache_key.outputs.prefix }}
          shared-key: phase-runner
          add-job-id-key: false
          add-rust-environment-hash-key: false
          workspaces: ". -> target"
          cache-workspace-crates: false
          save-if: false

      - name: Report phase-runner dependency cache
        env:
          CACHE_HIT: ${{ steps.phase_runner_cache.outputs.cache-hit }}
          CACHE_PRIMARY_KEY: ${{ steps.phase_runner_cache_key.outputs.primary }}
        run: |
          echo "phase-runner dependency-cache primary key: $CACHE_PRIMARY_KEY"
          echo "phase-runner dependency-cache hit: $CACHE_HIT"
          {
            echo "### phase-runner dependency cache"
            echo
            echo "- Primary key: \`$CACHE_PRIMARY_KEY\`"
            echo "- Exact hit: \`$CACHE_HIT\`"
          } >>"$GITHUB_STEP_SUMMARY"

      - name: cargo nextest (slice 3/3)
        run: >-
          ./scripts/test-db -- cargo nextest run
          -p phase-runner
          -p bigname-ingest
          -p bigname-interpret
          -p bigname-content-hash
          -p bigname-benchmark-gate
          -p bigname-lookup
          -p bigname-project
          -p bigname-metrics
          --features bigname-adapters/test-activation,bigname-storage/test-support
          --no-fail-fast
          --partition slice:3/3

  phase_runner:
    name: test (phase-runner)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - validation
      - phase_runner_shard_1
      - phase_runner_shard_2
      - phase_runner_shard_3
    if: always() && needs.validation.result == 'success' && needs.validation.outputs.reuse != 'true'
    steps:
      - name: Check phase-runner shards
        run: |
          if [ "${{ needs.phase_runner_shard_1.result }}" != "success" ] ||
             [ "${{ needs.phase_runner_shard_2.result }}" != "success" ] ||
             [ "${{ needs.phase_runner_shard_3.result }}" != "success" ]; then
            echo "phase-runner shard 1/3: ${{ needs.phase_runner_shard_1.result }}"
            echo "phase-runner shard 2/3: ${{ needs.phase_runner_shard_2.result }}"
            echo "phase-runner shard 3/3: ${{ needs.phase_runner_shard_3.result }}"
            exit 1
          fi

  e2e_build:
    needs: [validation]
    name: build (e2e phase-runner)
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    outputs:
      artifact-name: ${{ steps.package.outputs.artifact-name }}
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang libclang-dev binutils

      - name: Compute phase-runner dependency-cache key
        id: phase_runner_cache_key
        run: |
          root_lock_sha="$(sha256sum Cargo.lock | cut -d' ' -f1)"
          e2e_lock_sha="$(sha256sum tests/e2e/Cargo.lock | cut -d' ' -f1)"
          prefix="v1-rust-${RUST_VERSION}-${root_lock_sha}-${e2e_lock_sha}"
          runner_arch="$(printf '%s' "$RUNNER_ARCH" | tr '[:upper:]' '[:lower:]')"
          primary="${prefix}-phase-runner-${RUNNER_OS}-${runner_arch}"
          echo "prefix=$prefix" >>"$GITHUB_OUTPUT"
          echo "primary=$primary" >>"$GITHUB_OUTPUT"
          echo "phase-runner dependency-cache primary key: $primary"

      - name: Cache e2e phase-runner Cargo dependencies
        id: phase_runner_cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: ${{ steps.phase_runner_cache_key.outputs.prefix }}
          shared-key: phase-runner
          add-job-id-key: false
          add-rust-environment-hash-key: false
          workspaces: ". -> target"
          cache-workspace-crates: false
          save-if: true

      - name: Report phase-runner dependency cache
        env:
          CACHE_HIT: ${{ steps.phase_runner_cache.outputs.cache-hit }}
          CACHE_PRIMARY_KEY: ${{ steps.phase_runner_cache_key.outputs.primary }}
        run: |
          echo "phase-runner dependency-cache primary key: $CACHE_PRIMARY_KEY"
          echo "phase-runner dependency-cache hit: $CACHE_HIT"
          {
            echo "### phase-runner dependency cache"
            echo
            echo "- Primary key: \`$CACHE_PRIMARY_KEY\`"
            echo "- Exact hit: \`$CACHE_HIT\`"
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Sync pinned upstream checkouts
        if: needs.validation.outputs.reuse != 'true'
        run: |
          scripts/sync-refs
          scripts/sync-refs --check

      - name: Build and package phase-runner
        if: needs.validation.outputs.reuse != 'true'
        id: package
        run: |
          build_started="$(date +%s)"
          cargo build --locked --package phase-runner --bin phase-runner
          build_finished="$(date +%s)"

          package_started="$(date +%s)"
          package_dir="$GITHUB_WORKSPACE/target/bigname-e2e-package"
          upload_dir="$GITHUB_WORKSPACE/target/bigname-e2e-upload"
          mkdir -p "$package_dir" "$upload_dir"
          install -m 0755 target/debug/phase-runner "$package_dir/phase-runner"

          unstripped_bytes="$(stat -c %s target/debug/phase-runner)"
          strip --strip-debug "$package_dir/phase-runner"
          if readelf -SW "$package_dir/phase-runner" | grep -E '[[:space:]]\.debug_' |
            grep -Fv '.debug_gdb_scripts'; then
            echo "strip --strip-debug left DWARF data sections in the staged executable" >&2
            exit 1
          fi
          stripped_bytes="$(stat -c %s "$package_dir/phase-runner")"
          stripped_sha256="$(sha256sum "$package_dir/phase-runner" | cut -d' ' -f1)"
          (
            cd "$package_dir"
            sha256sum phase-runner >SHA256SUMS
          )
          {
            printf 'source SHA: %s\n' "$GITHUB_SHA"
            rustc -Vv
            cargo -V
            printf 'unstripped binary bytes: %s\n' "$unstripped_bytes"
            printf 'stripped binary bytes: %s\n' "$stripped_bytes"
            printf 'stripped binary SHA-256: %s\n' "$stripped_sha256"
          } >"$package_dir/BUILD-METADATA"

          tar_path="$upload_dir/phase-runner-e2e.tar"
          tar -C "$package_dir" -cf "$tar_path" phase-runner SHA256SUMS BUILD-METADATA
          artifact_bytes="$(stat -c %s "$tar_path")"
          if [ "$artifact_bytes" -gt 536870912 ]; then
            echo "phase-runner artifact is $artifact_bytes bytes; 512 MiB maximum is 536870912" >&2
            exit 1
          fi
          package_finished="$(date +%s)"

          reduction_percent="$(awk -v before="$unstripped_bytes" -v after="$stripped_bytes" \
            'BEGIN { printf "%.2f", (before - after) * 100 / before }')"
          echo "build-seconds=$((build_finished - build_started))" >>"$GITHUB_OUTPUT"
          echo "package-seconds=$((package_finished - package_started))" >>"$GITHUB_OUTPUT"
          echo "unstripped-bytes=$unstripped_bytes" >>"$GITHUB_OUTPUT"
          echo "stripped-bytes=$stripped_bytes" >>"$GITHUB_OUTPUT"
          echo "artifact-bytes=$artifact_bytes" >>"$GITHUB_OUTPUT"
          echo "stripped-sha256=$stripped_sha256" >>"$GITHUB_OUTPUT"
          echo "reduction-percent=$reduction_percent" >>"$GITHUB_OUTPUT"
          echo "artifact-name=phase-runner-e2e-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >>"$GITHUB_OUTPUT"

      - name: Upload phase-runner artifact
        if: needs.validation.outputs.reuse != 'true'
        id: artifact_upload
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.artifact-name }}
          path: target/bigname-e2e-upload/phase-runner-e2e.tar
          compression-level: 1
          retention-days: 3
          if-no-files-found: error

      - name: Summarize phase-runner artifact
        if: needs.validation.outputs.reuse != 'true'
        run: |
          {
            echo "### e2e phase-runner artifact"
            echo
            echo "- Dependency-cache key: \`${{ steps.phase_runner_cache_key.outputs.primary }}\`"
            echo "- Dependency-cache hit: \`${{ steps.phase_runner_cache.outputs.cache-hit }}\`"
            echo "- Build command: ${{ steps.package.outputs.build-seconds }}s"
            echo "- Strip/package: ${{ steps.package.outputs.package-seconds }}s"
            echo "- Unstripped binary: ${{ steps.package.outputs.unstripped-bytes }} bytes"
            echo "- Stripped binary: ${{ steps.package.outputs.stripped-bytes }} bytes"
            echo "- Tar before action compression: ${{ steps.package.outputs.artifact-bytes }} bytes"
            echo "- Strip reduction: ${{ steps.package.outputs.reduction-percent }}%"
            echo "- Executable SHA-256: \`${{ steps.package.outputs.stripped-sha256 }}\`"
            echo "- Action digest: \`${{ steps.artifact_upload.outputs.artifact-digest }}\`"
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Warm phase-runner dependencies
        if: needs.validation.outputs.reuse == 'true' && steps.phase_runner_cache.outputs.cache-hit != 'true'
        run: cargo build --locked --package phase-runner --bin phase-runner

  e2e_shard:
    name: test (e2e shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-24.04
    # 25 minutes covers a shard whose dependency cache restored. The extra 15 cover
    # the cold phase-runner build below, which only runs when the restore missed.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    needs:
      - validation
      - e2e_build
    # Start after the artifact and cache build; e2e results remain independently aggregated.
    if: ${{ !cancelled() && needs.e2e_build.result == 'success' && needs.validation.outputs.reuse != 'true' }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bigname
          POSTGRES_USER: bigname
          POSTGRES_PASSWORD: bigname
          POSTGRES_INITDB_ARGS: "--set=max_connections=300 --set=jit=off"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bigname -d bigname"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BIGNAME_DATABASE_URL: postgres://bigname:bigname@127.0.0.1:5432/bigname
      BIGNAME_E2E_TEST_THREADS: "8"
      BIGNAME_E2E_SHARD: "${{ matrix.shard }}"
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang libclang-dev

      - name: Compute phase-runner dependency-cache key
        id: phase_runner_cache_key
        run: |
          root_lock_sha="$(sha256sum Cargo.lock | cut -d' ' -f1)"
          e2e_lock_sha="$(sha256sum tests/e2e/Cargo.lock | cut -d' ' -f1)"
          prefix="v1-rust-${RUST_VERSION}-${root_lock_sha}-${e2e_lock_sha}"
          runner_arch="$(printf '%s' "$RUNNER_ARCH" | tr '[:upper:]' '[:lower:]')"
          primary="${prefix}-phase-runner-${RUNNER_OS}-${runner_arch}"
          echo "prefix=$prefix" >>"$GITHUB_OUTPUT"
          echo "primary=$primary" >>"$GITHUB_OUTPUT"
          echo "phase-runner dependency-cache primary key: $primary"

      - name: Restore e2e phase-runner Cargo dependencies
        id: phase_runner_cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: ${{ steps.phase_runner_cache_key.outputs.prefix }}
          shared-key: phase-runner
          add-job-id-key: false
          add-rust-environment-hash-key: false
          workspaces: ". -> target"
          cache-workspace-crates: false
          save-if: false

      - name: Report phase-runner dependency cache
        env:
          CACHE_HIT: ${{ steps.phase_runner_cache.outputs.cache-hit }}
          CACHE_PRIMARY_KEY: ${{ steps.phase_runner_cache_key.outputs.primary }}
        run: |
          echo "phase-runner dependency-cache primary key: $CACHE_PRIMARY_KEY"
          echo "phase-runner dependency-cache hit: $CACHE_HIT"
          {
            echo "### phase-runner dependency cache"
            echo
            echo "- Primary key: \`$CACHE_PRIMARY_KEY\`"
            echo "- Exact hit: \`$CACHE_HIT\`"
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Install foundry (anvil)
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}

      - name: Sync pinned upstream checkouts
        run: |
          scripts/sync-refs
          scripts/sync-refs --check

      - name: Download phase-runner artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.e2e_build.outputs.artifact-name }}
          path: target/bigname-e2e-download
          digest-mismatch: error

      - name: Verify phase-runner artifact
        run: |
          artifact_dir="$GITHUB_WORKSPACE/target/bigname-e2e-artifact"
          mkdir -p "$artifact_dir"
          tar -xf target/bigname-e2e-download/phase-runner-e2e.tar -C "$artifact_dir"
          (
            cd "$artifact_dir"
            sha256sum -c SHA256SUMS
            grep -Fx "source SHA: $GITHUB_SHA" BUILD-METADATA
            test -x phase-runner
            file phase-runner
            ldd phase-runner | tee dynamic-dependencies.txt
            if grep -F "not found" dynamic-dependencies.txt; then
              echo "phase-runner artifact has a missing dynamic dependency" >&2
              exit 1
            fi
          )
          echo "BIGNAME_E2E_CANONICAL_PHASE_RUNNER=$artifact_dir/phase-runner" >>"$GITHUB_ENV"

      # The harness builds phase-runner under BIGNAME_E2E_COMMAND_TIMEOUT_SECS (600s).
      # With restored dependencies that build compiles only this workspace's crates.
      # When the builder could not save the cache (run 35203124311 hit a cache API
      # rate limit), the harness build compiles every dependency, Reth included,
      # which takes about 600s even on an idle runner (612s in that run's builder)
      # and overran the deadline here. Build once outside the deadline instead, with
      # the harness's own command, profile and target directory, so the timed build
      # stays incremental.
      - name: Build phase-runner dependencies after a cache miss
        if: steps.phase_runner_cache.outputs.cache-hit != 'true'
        run: cargo build --locked --package phase-runner --bin phase-runner

      - name: Run e2e shard ${{ matrix.shard }}/3
        run: tests/e2e/run-gate

  api_container_shutdown:
    needs: [validation]
    name: test (API container shutdown)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    # Start immediately and use any available dependency cache. A cache miss only
    # means the prerequisite below compiles locally; it does not require e2e_build.
    if: ${{ !cancelled() }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bigname
          POSTGRES_USER: bigname
          POSTGRES_PASSWORD: bigname
          POSTGRES_INITDB_ARGS: "--set=jit=off"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bigname -d bigname"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BIGNAME_DATABASE_URL: postgres://bigname:bigname@127.0.0.1:5432/bigname
      BIGNAME_E2E_SHUTDOWN_SOURCE_SHA: ${{ github.sha }}
      BIGNAME_E2E_SHUTDOWN_EVIDENCE: ${{ github.workspace }}/target/api-container-shutdown
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        if: needs.validation.outputs.reuse != 'true'
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: foundry-rs/foundry-toolchain@v1
        if: needs.validation.outputs.reuse != 'true'
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      - name: Install native build dependencies
        if: needs.validation.outputs.reuse != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang libclang-dev
      - name: Sync pinned references
        if: needs.validation.outputs.reuse != 'true'
        run: |
          scripts/sync-refs
          scripts/sync-refs --check
      - name: Compute phase-runner dependency-cache key
        if: needs.validation.outputs.reuse != 'true'
        id: phase_runner_cache_key
        run: |
          root_lock_sha="$(sha256sum Cargo.lock | cut -d' ' -f1)"
          e2e_lock_sha="$(sha256sum tests/e2e/Cargo.lock | cut -d' ' -f1)"
          prefix="v1-rust-${RUST_VERSION}-${root_lock_sha}-${e2e_lock_sha}"
          runner_arch="$(printf '%s' "$RUNNER_ARCH" | tr '[:upper:]' '[:lower:]')"
          primary="${prefix}-phase-runner-${RUNNER_OS}-${runner_arch}"
          echo "prefix=$prefix" >>"$GITHUB_OUTPUT"
          echo "primary=$primary" >>"$GITHUB_OUTPUT"
          echo "phase-runner dependency-cache primary key: $primary"

      # Same workspace, lockfiles, and debug profile as `build (e2e phase-runner)`,
      # so a compatible dependency cache from an earlier run can be reused.
      - name: Cache e2e phase-runner Cargo dependencies
        if: needs.validation.outputs.reuse != 'true'
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: ${{ steps.phase_runner_cache_key.outputs.prefix }}
          shared-key: phase-runner
          add-job-id-key: false
          add-rust-environment-hash-key: false
          workspaces: ". -> target"
          cache-workspace-crates: false
          save-if: false

      - name: Build canonical phase-runner prerequisite
        if: needs.validation.outputs.reuse != 'true'
        env:
          BIGNAME_BUILD_SHA: ${{ github.sha }}
        run: |
          cargo build --locked --package phase-runner --bin phase-runner
          sha256sum target/debug/phase-runner
      # The Dockerfile names its base images by tag, and both tags are republished
      # upstream without any file here changing. A republish invalidates every layer
      # built on it, so the digests belong in the cache key below: an entry is
      # immutable once saved, and a key that stayed the same across a republish
      # would restore the stale layers and rebuild cold on every run, never saving.
      - name: Resolve the image build's base digests
        id: base_images
        run: |
          # `.Manifest.Digest` is the descriptor digest buildx attaches to the resolved
          # index, the same value its default inspector prints as `Digest:` and the
          # one BuildKit pins `FROM` to. The guard keeps a format change from turning
          # into a key that silently stops rotating.
          resolve() {
            local digest
            digest="$(docker buildx imagetools inspect "$1" --format '{{ .Manifest.Digest }}')"
            case "$digest" in
              sha256:[0-9a-f]*) printf '%s\n' "${digest#sha256:}" ;;
              *) echo "could not resolve a digest for $1: got '$digest'" >&2; return 1 ;;
            esac
          }
          builder="$(resolve "rust:${RUST_VERSION}-bookworm")"
          runtime="$(resolve "ubuntu:24.04")"
          echo "builder=${builder}" >>"$GITHUB_OUTPUT"
          echo "runtime=${runtime}" >>"$GITHUB_OUTPUT"
          echo "rust:${RUST_VERSION}-bookworm is sha256:${builder}; ubuntu:24.04 is sha256:${runtime}"

      # The image build compiles the whole workspace in release mode. Its builder
      # is per-run, so restore its layers to avoid compiling dependencies cold.
      # The Dockerfile builds third-party dependencies in their own
      # layer, ahead of any first-party source, so an ordinary commit reuses that layer
      # and recompiles only this workspace's crates.
      # Restore on every ref; only main saves the shared entry below. PR and
      # merge-queue copies cannot serve later PRs and compete for cache space.
      - name: Restore exact-image build layers
        id: shutdown_image_cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/shutdown-image-cache
          # Keyed on every input of the dependency layer and nothing else: the base
          # image digests, the manifests the Dockerfile copies ahead of it, the
          # lockfile, the toolchain and cargo config, and the Dockerfile itself. Not
          # the commit, because the first-party layers change every commit anyway,
          # and a per-commit key would write a multi-gigabyte entry every run and
          # evict the Cargo caches the other jobs depend on. Every input is in the
          # key for the same reason the digests are: a change that left the key
          # alone could never save its rebuilt layers.
          key: v1-shutdown-image-${{ env.RUST_VERSION }}-${{ steps.base_images.outputs.builder }}-${{ steps.base_images.outputs.runtime }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'apps/*/Cargo.toml', 'crates/*/Cargo.toml', 'tools/*/Cargo.toml', 'rust-toolchain.toml', '.cargo/config.toml', 'Dockerfile') }}
          restore-keys: |
            v1-shutdown-image-${{ env.RUST_VERSION }}-${{ steps.base_images.outputs.builder }}-
            v1-shutdown-image-${{ env.RUST_VERSION }}-

      - name: Prove exact-image API shutdown
        if: needs.validation.outputs.reuse != 'true'
        env:
          BIGNAME_E2E_SHUTDOWN_BUILD_CACHE: ${{ runner.temp }}/shutdown-image-cache
        run: scripts/test-container-shutdown
      - name: Warm exact-image build layers
        if: needs.validation.outputs.reuse == 'true' && steps.shutdown_image_cache.outputs.cache-hit != 'true'
        env:
          BIGNAME_E2E_SHUTDOWN_BUILD_CACHE: ${{ runner.temp }}/shutdown-image-cache
        run: scripts/test-container-shutdown --build-only
      - name: Retain shutdown evidence
        if: (always()) && (needs.validation.outputs.reuse != 'true')
        uses: actions/upload-artifact@v7
        with:
          name: api-container-shutdown
          path: target/api-container-shutdown
          if-no-files-found: error
      - name: Save exact-image build layers
        if: github.ref == 'refs/heads/main' && steps.shutdown_image_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/shutdown-image-cache
          key: ${{ steps.shutdown_image_cache.outputs.cache-primary-key }}

  e2e:
    name: test (e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - validation
      - e2e_build
      - e2e_shard
      - api_container_shutdown
    if: always()
    steps:
      - name: Check e2e builder and shards
        run: |
          if [ "${{ needs.e2e_build.result }}" != "success" ] ||
             { [ "${{ needs.validation.outputs.reuse }}" != "true" ] && [ "${{ needs.e2e_shard.result }}" != "success" ]; } ||
             [ "${{ needs.api_container_shutdown.result }}" != "success" ]; then
            echo "API container: ${{ needs.api_container_shutdown.result }}"
            echo "e2e builder:   ${{ needs.e2e_build.result }}"
            echo "e2e shards:   ${{ needs.e2e_shard.result }}"
            exit 1
          fi

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - validation
      - schema_v2
      - test_shard
      - api
      - phase_runner
      - e2e
      - site
    if: always()
    steps:
      - name: Check test shards
        run: |
          if [ "${{ needs.validation.result }}" != "success" ]; then
            echo "CI validation selection failed"
            exit 1
          fi
          if [ "${{ needs.validation.outputs.reuse }}" != "true" ] && [ "${{ needs.schema_v2.result }}" != "success" ]; then
            echo "schema v2 finished with result: ${{ needs.schema_v2.result }}"
            exit 1
          fi
          if [ "${{ needs.test_shard.result }}" != "success" ]; then
            echo "test shards finished with result: ${{ needs.test_shard.result }}"
            exit 1
          fi
          if [ "${{ needs.api.result }}" != "success" ]; then
            echo "API tests finished with result: ${{ needs.api.result }}"
            exit 1
          fi
          if [ "${{ needs.validation.outputs.reuse }}" != "true" ] && [ "${{ needs.phase_runner.result }}" != "success" ]; then
            echo "phase-runner finished with result: ${{ needs.phase_runner.result }}"
            exit 1
          fi
          if [ "${{ needs.e2e.result }}" != "success" ]; then
            echo "e2e finished with result: ${{ needs.e2e.result }}"
            exit 1
          fi
          if [ "${{ needs.site.result }}" != "success" ]; then
            echo "site finished with result: ${{ needs.site.result }}"
            exit 1
          fi

  artifacts-and-smoke:
    needs: [validation]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bigname
          POSTGRES_USER: bigname
          POSTGRES_PASSWORD: bigname
          POSTGRES_INITDB_ARGS: "--set=jit=off"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bigname -d bigname"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BIGNAME_DATABASE_URL: postgres://bigname:bigname@127.0.0.1:5432/bigname
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      # Only main saves this cache (see the cache note at the top). Pull requests
      # and merge queue runs restore main's entry, falling back to main's entry
      # for an older Cargo.lock, and save nothing: their copies were invisible
      # to every other run and pushed main's entries out of the 10 GB limit.
      - name: Cache cargo artifacts
        id: cargo_cache
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Fetch smoke dependencies
        if: needs.validation.outputs.reuse != 'true'
        run: |
          cargo fetch --locked
          docker pull caddy:2-alpine

      - name: Sync upstream refs
        if: needs.validation.outputs.reuse != 'true'
        run: scripts/sync-refs

      - name: Initialize phase schema
        if: needs.validation.outputs.reuse != 'true'
        run: cargo run --locked -p phase-runner --bin phase-runner -- init-schema

      - name: release smoke gate (no network)
        if: needs.validation.outputs.reuse != 'true'
        run: ./scripts/release-smoke --no-network

      - name: rollback smoke gate (no network)
        if: needs.validation.outputs.reuse != 'true'
        run: ./scripts/rollback-smoke --no-network

      # The committed Caddyfile in front of a fixture upstream that already
      # answers /openapi.json, which the API does not until TYR-18.
      - name: OpenAPI edge regression (fixture upstream)
        if: needs.validation.outputs.reuse != 'true'
        run: ./scripts/tests/openapi-edge-smoke

      - name: Warm smoke build dependencies
        if: needs.validation.outputs.reuse == 'true' && steps.cargo_cache.outputs.cache-hit != 'true'
        run: cargo build --locked -p phase-runner --bin phase-runner
