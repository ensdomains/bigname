# Generated by scripts/check-rust-file-size --print-baseline.
# Tracks oversized hand-written production Rust files for the Phase 7 allowlist.

[settings]
warning_loc = 500
allowlist_required_loc = 600
review_required_loc = 900
new_file_max_loc = 1200
wiring_target_loc = 300
wiring_allowlist_required_loc = 500
wiring_files = ["lib.rs", "main.rs"]

[[files]]
path = "crates/adapters/src/schema_v2/state_restore.rs"
loc = 603
justification = "Per-family v1 restore arms stay in one file so replay equivalence against the live arms is reviewed in one place; the masked-write snapshot-sync invariant comment pushed the file past the gate, and it stays well under the review threshold."

[[files]]
path = "crates/storage/src/record_inventory/snapshot_reads.rs"
loc = 612
justification = "Snapshot admission, anchor fallback, and canonical-lineage proof remain together; this slice ratchets the file below its base allowance without expanding its responsibilities."

[[files]]
path = "tools/benchmark-gate/src/api_load.rs"
loc = 1173
justification = "The benchmark API orchestrator keeps target-identity boundaries, seed probes, timed sampling, and the single report contract together so a release gate cannot omit a validation phase."
review_justification = "Reviewed as non-serving release tooling: the file is below the 1200 LOC ceiling, its route workload builders and corpus loading are split into child modules, and its remaining code is one auditable gate sequence plus focused tests."

[[files]]
path = "tools/benchmark-gate/src/api_load/corpus.rs"
loc = 1043
justification = "Production-scale corpus queries, their shared API-visibility filters, scale floors, namespace coverage, and database regressions remain together so the sampled and counted populations cannot drift apart."
review_justification = "Reviewed as non-serving release tooling: the file remains below the 1200 LOC ceiling, production query assembly is compact, and most of its size is database-backed coverage proving every sampled corpus family follows its serving-read visibility predicate."

[[files]]
path = "tools/benchmark-gate/src/database.rs"
loc = 1046
justification = "Read-only and disposable-copy connection preflights, per-connection instance pinning, marker authorization, and their database-backed safety tests remain co-located for one reviewable connection boundary."
review_justification = "Reviewed as non-serving release tooling: the file is below the 1200 LOC ceiling and most of its length is focused refusal-path coverage for the two connection modes rather than additional production responsibilities."

[[files]]
path = "tools/benchmark-gate/src/indexing.rs"
loc = 749
justification = "Index timing, rebuild, throughput, memory measurement, and red-report construction remain one release-gate operation with its budget and false-green regression tests."

[[files]]
path = "tools/benchmark-gate/src/main.rs"
loc = 510
justification = "The benchmark binary wiring keeps command parsing, wrapper attestations, clean-source enforcement, and report assembly in one entrypoint; workload implementation remains split into dedicated modules."
