bigname-manifests.workspace = true
bigname-metrics.workspace = true
bigname-project.workspace = true
bigname-storage.workspace = true

[build-dependencies]
bigname-content-hash.workspace = true
bigname-manifests.workspace = true

[dev-dependencies]
