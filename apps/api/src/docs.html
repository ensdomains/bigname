<style>
  :root {

  *, *::before, *::after { box-sizing: border-box; }

  code, pre, .mono { font-family: var(--mono); }

  pre { margin: 0; } pre code { background: none; padding: 0; font-size: inherit; }
  p { margin: 0; }

  svg.px { display: block; overflow: visible; max-width: 100%; height: auto; }
  .v-mark-a { fill: var(--mark-a); } .v-pink { fill: var(--pink); }

  /* the mark's cell, used as a control */

  .chip { display: inline-flex; align-items: center; height: 20px; padding: 0 7px; border-radius: 6px; background: var(--navy); color: var(--on-navy); font-family: var(--mono); font-size: 11.5px; font-weight: 600; white-space: nowrap; }
  .chip.sky { background: var(--sky); color: #02293b; } .chip.pink { background: var(--pink); color: #fff; }

  .wrap { max-width: 1200px; margin: 0 auto; padding: 0 32px 96px; }
  .mast { display: flex; align-items: center; justify-content: space-between; height: 80px; }
  .lockup { display: inline-flex; align-items: center; gap: 11px; color: var(--ink); } .lockup:hover { text-decoration: none; }
  .lockup .word { font-family: var(--brand); font-size: 22px; font-weight: 500; letter-spacing: -.035em; line-height: 1; }
  .mast .right { display: flex; gap: 22px; align-items: center; font-family: var(--mono); font-size: 12.5px; color: var(--ink-soft); }
  .mast .right a { color: inherit; }
  .status { display: inline-flex; align-items: center; gap: 8px; }
  .status .tile { background: var(--sky); } .status.ok .tile { background: var(--navy); } .status.bad .tile { background: var(--pink); }
  button.theme { border: 0; padding: 0; cursor: pointer; width: 12px; height: 11px; border-radius: 3.6px; background: var(--navy); }

  .split > * { min-width: 0; }

  /* the index */
  .index { position: sticky; top: 0; max-height: 100vh; overflow: auto; padding: 16px 0 48px; font-family: var(--mono); font-size: 12.5px; line-height: 1.5; scrollbar-width: none; mask-image: linear-gradient(to bottom, #000 calc(100% - 48px), transparent); }
  .index::-webkit-scrollbar { display: none; }
  .index h2 { font-family: var(--sans); font-size: 13px; font-weight: 600; margin: 22px 0 6px; }
  .index h2:first-child { margin-top: 0; }
  .index a.e { display: flex; align-items: baseline; color: var(--ink-soft); padding: 2px 0; }
  .index a.e:hover { color: var(--ink); text-decoration: none; }
  .index a.e .bul { width: 16px; flex: none; }
  .index a.e .bul::before { content: ""; display: none; width: 9px; height: 8px; border-radius: 2.8px; background: var(--navy); }
  .index a.e.cur { color: var(--ink); } .index a.e.cur .bul::before { display: inline-block; }
  .index a.e .pfx, .index a.e b, .index a.e .m { color: var(--ink-faint); font-weight: 400; }
  .index a.e .m { margin-left: .8ch; font-size: 11.5px; }
  .s { white-space: nowrap; }
  .index .ver { margin-top: 32px; color: var(--ink-faint); font-size: 11.5px; }
  .ihero { display: none; }

  /* the page */

  .page .back { display: none; }
  .word-title { margin-bottom: 20px; }
  .page h1.path { font-family: var(--mono); font-weight: 400; font-size: 24px; line-height: 1.3; letter-spacing: -.01em; overflow-wrap: anywhere; }
  .page h1.path .pfx { color: var(--ink-soft); } .page h1.path b { font-weight: 400; color: var(--ink-faint); }
  .page .lede { font-size: 16.5px; color: var(--ink-soft); margin-top: 12px; text-wrap: pretty; max-width: 62ch; line-height: 1.55; }
  .page .lede code { font-size: .86em; }

  .line { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 0; border: 1.5px solid var(--line); background: var(--card); border-radius: 12px; padding: 9px 8px 9px 14px; font-family: var(--mono); font-size: 13.5px; line-height: 1.8; }
  .line .m { font-weight: 600; margin-right: 10px; flex: none; }
  .line .u { flex: 1; min-width: 0; overflow-wrap: anywhere; color: var(--ink); }
  .line .u .pfx { color: var(--ink-soft); } .line .u i { font-style: normal; color: var(--ink-faint); }
  .line input, .line select { border: 0; background: var(--field); border-radius: 5px; padding: 0 6px; height: 24px; font-family: var(--mono); font-size: 13px; color: var(--ink); outline: none; min-width: 3ch; max-width: 100%; vertical-align: baseline; }
  .line input:focus, .line select:focus { background: var(--sky); color: #02293b; }

  .line .go { margin-left: auto; display: inline-flex; gap: 8px; align-items: center; flex: none; padding-left: 12px; }
  .line .cp { background: none; border: 0; padding: 0 6px; color: var(--ink-soft); cursor: pointer; font-size: 12.5px; } .line .cp:hover { color: var(--ink); }

  .line .run:disabled { background: var(--sky); color: #02293b; cursor: default; }

  table.t td.n { color: var(--ink); } table.t td.code { font-family: var(--mono); font-size: 13px; white-space: nowrap; }
  details.note { margin: 4px 0; } details.note summary { cursor: pointer; list-style: none; font-weight: 500; display: flex; gap: 10px; align-items: baseline; padding: 4px 0; }

<script>
const D = (h, html) => `<details class="note"><summary>${h}</summary><div class="body">${html}</div></details>`;
const T = (head, rows) => `<div class="tw"><table class="t"><thead><tr>${head.map(h => `<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r => `<tr>${r.map((c, i) => `<td class="${i === 0 ? (/\s|<a /.test(c) ? 'n' : 'n code') : ''}">${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;

const GUIDES = [
{
  id: 'overview', title: 'bigname API',
  summary: 'Everything lives under the <code>/v1</code> path prefix, answers are JSON, and there is no authentication. These six rules apply to every question on this page.',
  keywords: ['quick start', 'base url', 'endpoints', 'routes'],
  sections: [
    { h: 'Examples', id: 'examples', html: `
<pre class="block"><code>$ curl -s /v1/names/taytems.eth
$ curl -s '/v1/names/taytems.eth/records?keys=addr:60,text:avatar'
$ curl -s /v1/addresses/0x8e8Db5CcEF88cca9d624701Db544989C996E3216/primary-name
$ curl -s -X POST /v1/lookup -H 'content-type: application/json' \\
       -d '{"profile":"feed","inputs":[{"name":"taytems.eth"}]}'</code></pre>` },
    { h: 'Manual pages', id: 'pages', html: '__ROUTE_TABLE__' },
    { h: 'The six rules', id: 'rules', html: `
<ol>
  <li>A successful response is <code>{data, page?, meta}</code>. A failed one is <code>{error: {code, message, details}}</code>. See <a href="#envelope">envelope(7)</a> and <a href="#errors">errors(7)</a>.</li>
  <li>Names are ENSIP-15 normalized before lookup. The namespace is inferred from the name: anything under <code>base.eth</code> is <code>basenames</code>, everything else is <code>ens</code>. See <a href="#inputs">inputs(7)</a>.</li>
  <li>Routes that return one object pin themselves to chain positions and accept <code>at</code> and <code>finality</code>. Routes that return a list read the latest state. See <a href="#snapshots">snapshots(7)</a>.</li>
  <li>Lists page with opaque cursors. The default page holds 50 rows and the largest holds 200. See <a href="#pagination">paging(7)</a>.</li>
  <li>When part of an answer could not be established, the response carries <code>meta.completeness</code>, <code>meta.unsupported_fields</code>, or <code>unsupported_reason</code>. An empty array means the index knows the set is empty.</li>
  <li>A query parameter the route does not list is rejected with <code>400 invalid_input</code>.</li>
</ol>
<p>The process also serves <a href="#healthz">healthz(8)</a> and <code>POST /graphql</code>, an ENS-subgraph compatibility subset with its own contract that this reference does not cover.</p>` },
    { h: 'Reading this reference', id: 'reading', html: `<p>Each route has a manual page. The synopsis shows the path with every accepted query parameter; square brackets mark optional ones. The request section is live: edit the line, press enter, and the response prints beneath it. The description covers what the route returns and when. Notes hold the edge cases and are collapsed until you open them.</p><p>Type <code>/</code> to filter the index and <code>[</code> or <code>]</code> to move between pages.</p>` },
  ],
},
{
  id: 'envelope', title: 'Envelope',
  summary: 'Every route under <code>/v1</code> wraps its answer in the same envelope. <code>data</code> holds the answer, <code>page</code> appears on lists, and <code>meta</code> describes the chain positions the answer was read at and how complete it is.',
  keywords: ['data', 'page', 'meta', 'as_of', 'as_of_token', 'as_of_completeness', 'completeness', 'unsupported_fields', 'unsupported_reason', 'source', 'error'],
  sections: [
    { h: 'Success', id: 'success', html: `
<pre class="block"><code>${K(`{
  "data": { … },                 <span class="c">an object on single-object routes, an array on lists</span>
  "page": {                      <span class="c">lists only</span>
    "cursor": null, "next_cursor": "…", "page_size": 50, "total_count": null, "has_more": true
  },
  "meta": {
    "as_of": { "1": { "block_number": 23400118, "block_hash": "0x…", "timestamp": "2026-09-11T00:00:00Z" } },
    "as_of_token": "…",
    "as_of_completeness": { "8453": { "completeness": "unsupported", "unsupported_reason": "temporarily_unavailable" } },
    "completeness": "partial",
    "unsupported_fields": ["role_summary"],
    "unsupported_reason": "not_supported_for_namespace",
    "source": "indexed"
  }
}`)}</code></pre>
<p>Only <code>data</code> and <code>meta</code> are always present; every other field appears when it applies. Three routes nest their paging inside <code>data</code> instead of using the top-level <code>page</code>: <a href="#lookup">lookup(2)</a> pages each address input separately, <a href="#resolver">resolvers(2)</a> pages <code>bound_names</code>, and <a href="#registry">registries(2)</a> pages <code>referenced_by</code>.</p>` },
    { h: 'Meta fields', id: 'meta', html: `<dl class="fields">
<dt>as_of</dt><dd>The chain position the answer was served from, keyed by the chain ID as a string. It is there for attribution and is not an input to anything.</dd>
<dt>as_of_token</dt><dd>An opaque token naming those exact positions. Pass it back as <code>at</code> on a compatible route to read the same snapshot again. It cannot be assembled from <code>as_of</code>.</dd>
<dt>as_of_completeness</dt><dd>Chains that were in scope but withheld from the read. Its keys never overlap with <code>as_of</code>, and the field is omitted when nothing was withheld.</dd>
<dt>completeness</dt><dd>One of <code>full</code>, <code>partial</code>, or <code>unsupported</code>. Omitted when the read was clean.</dd>
<dt>unsupported_fields</dt><dd>Sections or expansions the route could not serve, for example <code>["role_summary"]</code>.</dd>
<dt>unsupported_reason</dt><dd>Why the read was not clean. Always present when completeness is <code>unsupported</code>.</dd>
<dt>source</dt><dd>Either <code>indexed</code> or <code>verified</code>, on routes that let you choose a source.</dd>
</dl>
<p>Single-object chain reads carry <code>as_of</code> and <code>as_of_token</code>. Product collections report <code>as_of</code> for the published data used by the page, without a token. <a href="#lookup">lookup(2)</a> reports its served positions and a token when available. <a href="#status">status(2)</a> and <a href="#namespace">namespaces(2)</a> carry neither.</p>` },
    { h: 'Failure', id: 'error', html: `<pre class="block"><code>${K(`{ "error": { "code": "unsupported", "message": "the requested route option is not supported", "details": {} } }`)}</code></pre><p>The error envelope is used only when the whole request fails. A problem with one item inside a successful answer is reported in that item's own <code>status</code> field. The codes are listed in <a href="#errors">errors(7)</a>.</p>` },
    { h: 'Encoding', id: 'encoding', html: `<ul>
<li>Timestamps are RFC 3339 in UTC with a <code>Z</code> suffix. Fractional seconds are kept when they are not zero.</li>
<li>Map keys are always strings, so a chain appears as <code>"8453"</code> and a coin type as <code>"60"</code>. As a field, <code>chain_id</code> is a number. <code>coin_type</code> is a number as a field and a decimal string inside selectors and map keys. <code>token_id</code> is a decimal string.</li>
<li>A field the index cannot back is omitted rather than set to <code>null</code>. A map the index knows to be empty is <code>{}</code>.</li>
<li>Address and contenthash values are the resolver's raw bytes as lowercase <code>0x</code> hex. See <a href="#record-keys">record-keys(7)</a>.</li>
</ul>` },
  ],
},
{
  id: 'errors', title: 'Errors',
  summary: 'A request fails as a whole with an HTTP status and an error code, or it succeeds and reports problems with individual items through their <code>status</code> field. This page lists both vocabularies.',
  keywords: ['invalid_input', 'not_found', 'unsupported', 'stale', 'conflict', 'request_timeout', 'rate_limited', 'overloaded', 'internal_error', 'status', 'ok', 'mismatch', 'failed'],
  sections: [
    { h: 'Request failures', id: 'codes', html: T(['HTTP', 'code', 'When it happens'], [
      ['400', 'invalid_input', 'The input is malformed, the path name cannot be normalized, a query parameter is unknown, or two parameters conflict.'],
      ['404', 'not_found', 'A single-object route has no answer. Lists never answer 404 for an empty result; they answer 200 with an empty <code>data</code> array.'],
      ['409', 'stale', 'Compatible published data is unavailable, a redo is rewriting history, or state moved during the read. A collection cursor for replaced data requires restarting without the cursor; otherwise retry the request.'],
      ['409', 'conflict', 'The selector or the deployment state cannot form one snapshot. Examples are an <code>at</code> outside the readable lineage and a deployment with no ready public namespace.'],
      ['422', 'unsupported', 'The route cannot produce its contract for this input, such as an unsupported filter combination or a verified selector set over the cap.'],
      ['408', 'request_timeout', 'The whole-request deadline passed.'],
      ['429', 'rate_limited', 'The client exceeded the verified-execution limit, which is counted per IPv4 address or per IPv6 /64.'],
      ['503', 'overloaded', 'An in-flight ceiling was exhausted. The request was rejected before queueing.'],
      ['500', 'internal_error', 'Something unexpected failed. Provider transport failures on verified reads land here.'],
    ]) },
    { h: 'Item status', id: 'status', html: T(['status', 'Meaning'], [
      ['ok', 'The item produced an answer. A released name can still be <code>ok</code>.'],
      ['not_found', 'There is no answer for this item. Stored record bytes of length zero, and an <code>addr:60</code> of twenty zero bytes on ENSv1 or Basenames, also report this.'],
      ['invalid_name', 'The input failed ENSIP-15 normalization.'],
      ['mismatch', 'A claimed answer verified to a different value.'],
      ['unsupported', 'The index cannot serve this item. An <code>unsupported_reason</code> is always attached; reasons the build does not recognize publish as <code>unsupported_reason_unrecognized</code>.'],
      ['stale', 'The selected snapshot is not servable for this item, for example because the provider cannot serve the block.'],
      ['failed', 'Execution failed. A <code>failure_reason</code> may accompany <code>failed</code>, <code>stale</code>, <code>not_found</code>, and <code>mismatch</code>.'],
    ]) + `<p><a href="#status">status(2)</a> uses a different set of words, <code>ready</code>, <code>degraded</code>, and <code>stale</code>, because it describes the index rather than an item.</p>` },
    { h: 'Routes that answer 200 for a miss', id: 'exceptions', html: `<ul>
<li><a href="#lookup">lookup(2)</a> reports each input's <code>status</code> in band. A missing input never fails the batch.</li>
<li><a href="#primary-name">addresses-primary(2)</a> answers 200 for any valid address and coin type and reports the outcome inside <code>answers</code>.</li>
<li><a href="#name">names(2)</a> answers 200 for a registration that has ended, with <code>registration_status</code> set to <code>released</code>. It answers 404 only for a name the index has never observed.</li>
</ul>` },
    { h: 'Verified reads', id: 'verified', html: `<p>Routes that call resolvers live map provider failures as follows.</p>` + T(['Failure', 'Result'], [
      ['The provider cannot serve the selected block', 'Each affected key reports <code>stale</code>. On the name profile the verified section is <code>stale</code>.'],
      ['A completed RPC failure, a malformed answer, or a provider response timeout', 'The item reports <code>failed</code> with a <code>failure_reason</code>.'],
      ['A connect timeout, DNS or TLS failure, or a connection reset', 'The whole request fails with <code>500 internal_error</code>. A <code>source=auto</code> read does not return a partial blend.'],
      ['A primary-name CCIP-Read gateway timeout or exhausted budget', 'That answer reports <code>failed</code>.'],
      ['The whole-request deadline', 'The request fails with <code>408 request_timeout</code>.'],
    ]) + `<p>Nothing from a verified read is cached, so the next request executes afresh. Rate limits and in-flight ceilings apply only to requests that can trigger verified execution. A records read with <code>source=auto</code> and no <code>keys</code>, and a primary-name read with <code>source=indexed</code>, never do.</p>` },
  ],
},
{
  id: 'snapshots', title: 'Snapshots and sources',
  summary: 'Single-object routes let you choose which chain position to read with <code>at</code> and <code>finality</code>, and some let you choose whether the answer comes from the index or from a fresh call to the resolver with <code>source</code>.',
  keywords: ['at', 'finality', 'source', 'latest', 'safe', 'finalized', 'indexed', 'verified', 'auto', 'replay', 'as_of_token'],
  sections: [
    { h: 'Which routes accept what', id: 'which', html: `<dl class="fields prose">
<dt><a href="#name">names(2)</a>, <a href="#records">names-records(2)</a>, <a href="#resolver">resolvers(2)</a>, <a href="#registry">registries(2)</a>, and the exact-name diagnostics</dt><dd><code>at</code> yes. <code>finality</code> latest, safe, or finalized. The answer carries <code>as_of</code> and a token.</dd>
<dt><a href="#lookup">lookup(2)</a> and <a href="#primary-name">addresses-primary(2)</a></dt><dd>Neither. The answer carries the current positions, with a token when one is available.</dd>
<dt><a href="#resolver-aliases">Resolver aliases</a> and <a href="#resolver-roles">resolver roles</a></dt><dd><code>at</code> and all three finality values are accepted, subject to current projection availability. Cursors bind the selected snapshot and completed projection generation. These collections do not reconstruct historical binding or permission tables.</dd>
<dt>Latest-state product collections: names, subnames, history, address names, permissions, search, events, registry labels</dt><dd><code>at</code> is rejected with 400. <code>finality</code> latest only. Each page reports <code>as_of</code>. Continuations must restart with <code>409 stale</code> when the published state changes.</dd>
<dt><a href="#status">status(2)</a>, <a href="#namespace">namespaces(2)</a>, <a href="#diag-manifests">diag-manifests(2)</a></dt><dd>Neither, and no snapshot fields.</dd>
</dl>` },
    { h: 'Selectors', id: 'selectors', html: `<dl class="fields">
<dt>at</dt><dd>An RFC 3339 instant, or a <code>meta.as_of_token</code> from a compatible route. Encode a plus sign in the offset as <code>%2B</code>, as in <code>at=2025-06-15T17:37:42%2B02:30</code>.</dd>
<dt>finality</dt><dd><code>latest</code>, <code>safe</code>, or <code>finalized</code>. The default is <code>latest</code>. It is a floor that the selected position must satisfy.</dd>
</dl>
<p>The selected position must exist in the readable lineage, otherwise the route answers <code>409 conflict</code>. A read also needs compatible published data at most one block behind the stored head, even when <code>at</code> points into the past; without it the route answers <code>409 stale</code>. A completed publication remains readable while Project computes its replacement. <code>as_of</code> reports the position actually served.</p>
<p>The latest-state collections listed above accept only an omitted <code>finality</code> or <code>finality=latest</code>. An <code>at</code> on one of these collections is rejected with 400 and the message "at is not supported because collection routes read latest state". A <code>safe</code> or <code>finalized</code> finality on one of these collections is rejected with 400 and the message "finality must be latest because collection routes read latest state".</p>` },
    { h: 'Sources', id: 'sources', html: `<dl class="fields">
<dt>indexed</dt><dd>The published projection. This is the default everywhere.</dd>
<dt>verified</dt><dd>Fresh resolver calls on every request. Nothing is cached and nothing is written back. On <a href="#name">names(2)</a> only <code>addresses</code>, <code>text_records</code>, <code>content_hash</code>, and <code>primary_address</code> come from the live call.</dd>
<dt>auto</dt><dd>Accepted by <a href="#records">names-records(2)</a> only. Indexed answers that satisfy a key are kept and the remaining keys are verified. With <code>keys</code> omitted or empty the read stays indexed.</dd>
</dl>` + D('How verified reads stay consistent', `<ul>
<li>Verified execution runs at the engine's current readable position. When an <code>at</code>, <code>safe</code>, or <code>finalized</code> selection cannot be admitted at that position, the verified section reports <code>stale</code>. It is never executed at some other position.</li>
<li>An explicit <code>keys</code> list and the default set derived from inventory are each capped at 200 keys. A derived set over the cap is rejected with <code>422 unsupported</code> before any provider call.</li>
<li>A live answer that disagrees with the indexed value is recorded in a divergence ledger. Wildcard answers with no exact comparison row, and CCIP-Read answers, write nothing.</li>
<li>A cross-chain read reports the auxiliary chain's actual hash-pinned position. It may be older than the newest head but never newer, and equal height requires equal hash.</li>
</ul>`) + D('Which chains a scoped read covers', `<p>Public reverse lookup and search account for every chain in the request's scope. A request without <code>namespace</code> covers all active public namespaces; a request with one covers that namespace. Chains that were read appear in <code>meta.as_of</code>. Chains that were withheld appear in <code>meta.as_of_completeness</code> with the reason <code>temporarily_unavailable</code>. The rows never shrink that set. When no public namespace can serve, a request without <code>namespace</code> answers <code>409 conflict</code>.</p>`) },
  ],
},
{
  id: 'pagination', title: 'Paging',
  summary: 'Lists return one page at a time. To read the next page, repeat the same request with <code>cursor</code> set to the <code>next_cursor</code> of the page you have, and stop when <code>has_more</code> is false.',
  keywords: ['cursor', 'next_cursor', 'page_size', 'total_count', 'has_more'],
  sections: [
    { h: 'The page object', id: 'page', html: `<dl class="fields">
<dt>cursor</dt><dd>The cursor this page was requested with, or <code>null</code> on the first page.</dd>
<dt>next_cursor</dt><dd>The cursor for the following page, or <code>null</code> on the last one.</dd>
<dt>page_size</dt><dd>The size requested or served. The default is 50 and the maximum is 200.</dd>
<dt>total_count</dt><dd>The total number of rows when it is cheap to compute or was explicitly requested, otherwise <code>null</code>.</dd>
<dt>has_more</dt><dd>Whether another page exists.</dd>
</dl>` },
    { h: 'Rules', id: 'rules', html: `<ul>
<li>A cursor binds the anchor, namespace, filters, and sort of the request that produced it. Changing any of those while reusing the cursor is rejected with <code>400 invalid_input</code>.</li>
<li>Cursor bytes are not stable identifiers. Do not parse them or compare them.</li>
<li>Cursors from a <a href="#search">search(2)</a> or reverse <a href="#lookup">lookup(2)</a> made without <code>namespace</code> bind the derived set of public namespaces and fail closed if that set changes.</li>
<li>GET product collection cursors bind the published state and, where needed, the expiry evaluation time. If that state is replaced, the route returns <code>409 stale</code>; restart without a cursor. Reverse <a href="#lookup">lookup(2)</a> cursors keep a keyset position across current-state reads, while each response separately revalidates its served data.</li>
<li>History filters run before paging, so a page that is not the last holds exactly <code>page_size</code> rows. Reverse lookup may return a short page with <code>has_more</code> still true; keep paging.</li>
</ul>` + D('What happens to cursors during a rebuild', `<p>A rebuild that republishes a GET product collection invalidates its previous cursors even when event identities stay the same. Restart from the first page after <code>409 stale</code>. A cursor without the required publication reference also requires a restart. Diagnostics use their own event-identity cursor rules.</p>`) },
  ],
},
{
  id: 'inputs', title: 'Inputs',
  summary: 'How names, namespaces, addresses, chains, coin types, and relation sets are written in requests, and how the API echoes them.',
  keywords: ['namespace', 'ens', 'basenames', 'normalization', 'ENSIP-15', 'base.eth', 'address', 'chain_id', 'coin_type', 'relation', 'owner', 'manager', 'registrant', 'network'],
  sections: [
    { h: 'Namespaces', id: 'namespaces', html: `<dl class="fields">
<dt>ens</dt><dd>ENS on Ethereum, and ENSv2 where it is deployed. The name <code>base.eth</code> itself lives here.</dd>
<dt>basenames</dt><dd>Every name under <code>base.eth</code>, served from Base.</dd>
</dl>
<p>Name routes infer the namespace from the name and echo it in the response. Pass <code>namespace</code> to override the inference. Address routes default to <code>ens</code>. A namespace the deployment does not serve answers 404. <a href="#namespace">namespaces(2)</a> reports what each namespace supports.</p>` },
    { h: 'Names', id: 'names', html: `<ul>
<li>Names are ENSIP-15 normalized before lookup. A path name that cannot be normalized answers 400. A name in a lookup batch that cannot be normalized reports <code>invalid_name</code> in its own row.</li>
<li>Responses carry <code>name</code> in normalized form and <code>display_name</code> for display.</li>
<li>Only <a href="#subnames">names-subnames(2)</a> emits strings that are not names, for children whose label is unknown. Identify rows by <code>namehash</code> and <code>labelhash</code> rather than by parsing text.</li>
</ul>` },
    { h: 'Addresses, chains, and coin types', id: 'addresses', html: `<ul>
<li>Addresses are EVM hex addresses. A malformed address answers 400.</li>
<li><code>chain_id</code> is 1 for Ethereum, 8453 for Base, and 11155111 for Sepolia. <code>network</code> is the display slug, <code>ethereum</code> or <code>base</code>.</li>
<li><code>coin_type</code> follows ENS and SLIP-44. Coin type 60 is Ethereum and is the default.</li>
</ul>` },
    { h: 'Relation sets', id: 'relations', html: `<p>The <code>relation</code> parameter is a comma-separated set drawn from <code>owner</code>, <code>manager</code>, and <code>registrant</code>. A row matches when it holds any of them. The word <code>any</code> stands for all three. Matched rows report the subset that matched in <code>relations</code>. In storage terms the token holder is the owner and the effective controller is the manager.</p>` },
  ],
},
{
  id: 'record-keys', title: 'Record keys',
  summary: 'The <code>keys</code> parameter on record routes takes a comma-separated list of selectors. This page gives the selector grammar and the encoding of the values that come back.',
  keywords: ['keys', 'addr', 'text', 'avatar', 'contenthash', 'content_hash', 'addresses', 'text_records', 'ENSIP-19', 'default address', 'zero address'],
  sections: [
    { h: 'Selectors', id: 'grammar', html: `<dl class="fields">
<dt>addr:&lt;coin_type&gt;</dt><dd>An address record. The coin type is an unsigned 64-bit decimal number.</dd>
<dt>text:&lt;key&gt;</dt><dd>A text record. The key is non-empty and contains no ASCII whitespace and no commas.</dd>
<dt>avatar</dt><dd>Shorthand for <code>text:avatar</code>.</dd>
<dt>contenthash</dt><dd>The contenthash bytes.</dd>
</dl>
<p>Items are separated by commas and trimmed. Selectors for other record families, meaning ABI, pubkey, interface, DNS, legacy content, and arbitrary data, are rejected with <code>400 invalid_input</code>.</p>` },
    { h: 'Values', id: 'values', html: `<ul>
<li>Each keyed answer is <code>{status, value?, unsupported_reason?, failure_reason?, meta?}</code>. The <code>value</code> field is present only when the status is <code>ok</code>.</li>
<li>Address and contenthash values are the raw bytes as lowercase <code>0x</code> hex. Multicoin addresses are the native bytes and are not re-encoded. Contenthash is not decoded.</li>
<li>The <code>addresses</code> map, keyed by decimal coin type, together with <code>text_records</code> and <code>content_hash</code>, is a convenience view over the same answers.</li>
</ul>` + D('Empty values and the zero address', `<p>Stored bytes of length zero report <code>not_found</code> with no <code>value</code>. An <code>addr:60</code> of exactly twenty zero bytes on ENSv1 or Basenames also reports <code>not_found</code>, and it blocks the default-address fallback in indexed, auto, and verified answers alike. The stored evidence is not rewritten.</p>`) + D('The ENSIP-19 default address', `<p>When the selected resolver's admitted read feature supports it and the coin type maps to an EVM chain, a missing EVM-range address may be derived from <code>addr:2147483648</code>. A derived answer carries <code>meta: {"basis": "derived", "rule": "ensip19_default_address", "source_record_key": "addr:2147483648"}</code>. The admitted legacy Basenames resolver has no default fallback.</p>`) },
  ],
},
{
  id: 'vocabulary', title: 'Vocabulary',
  summary: 'Field names that recur across routes, the registration lifecycle words, and the NameWrapper fields.',
  keywords: ['registration_status', 'active', 'wrapped', 'registered', 'released', 'unregistered', 'wrapper_state', 'wrapper_fuses', 'emancipated', 'locked', 'fuses', 'completeness', 'dictionary', 'expires_at', 'registered_at', 'created_at', 'registration_id', 'token_id', 'display_name', 'namehash'],
  sections: [
    { h: 'Status, registration status, and completeness', id: 'three', html: `<p>Three fields answer three different questions and are easy to confuse.</p>` + T(['Field', 'Question it answers', 'Values'], [
      ['status', 'Did this item produce an answer?', 'ok, not_found, invalid_name, mismatch, unsupported, stale, failed'],
      ['registration_status', 'Where is this registration in its life?', 'active, wrapped, registered, released, unregistered'],
      ['completeness', 'How much of the answer could be established?', 'full, partial, unsupported'],
    ]) },
    { h: 'Lifecycle', id: 'lifecycle', html: `<dl class="fields">
<dt>released</dt><dd>The registration has ended, for example through an explicit ENSv2 unregister or an ENSv1 lease that lapsed past grace. The profile still answers 200 with identity and history, but owner, registrant, resolver, and records are omitted. A released ENSv1 name keeps the lapsed lease's <code>expires_at</code> and names its last holder in <code>lapsed_registration</code>.</dd>
<dt>unregistered</dt><dd>There is no current registration or control, and <code>registration_id</code> is omitted. An ownerless ENSv1 or Basenames registry row, or an ENSv2 TLD whose root-registry pointer survives without a projected registration, may still keep a resolver pointer that permits record reads. An ownerless ENSv2 reservation does not, except a root-registry TLD reservation.</dd>
</dl>` + D('When the current authority cannot be established', `<p>Name reads use the selected current authority rather than the newest event. When ENSv1 and ENSv2 overlap without a proven migration boundary, the profile reports <code>status: "unsupported"</code> with identity fields only and a reason such as <code>conflicting_current_ens_authority</code> on Mainnet or <code>independent_ens_deployments_overlap</code> on Sepolia. The reason <code>current_authority_not_projected</code> is handled differently: the route serves an indexed partial profile with identity and registration fields, <code>status: "ok"</code>, and no resolver.</p>`) },
    { h: 'NameWrapper', id: 'wrapper', html: `<p><code>wrapper_state</code>, which is <code>wrapped</code>, <code>emancipated</code>, or <code>locked</code>, and <code>wrapper_fuses</code> appear together or not at all. They show up on the name profile, on the <code>bound_names</code> rows of a resolver overview, and on permission rows.</p>
<pre class="block"><code>${K(`{ "fuses": 196609, "cannot_unwrap": true, "cannot_burn_fuses": false, "cannot_transfer": false,
  "cannot_set_resolver": false, "cannot_set_ttl": false, "cannot_create_subdomain": false, "cannot_approve": false,
  "parent_cannot_control": true, "is_dot_eth": true, "can_extend_expiry": false }`)}</code></pre>` + D('What expiry does to the wrapper fields', `<p>The fields are evaluated at the served block's timestamp. After the wrapper expiry the state word and every boolean clear. A plain wrapped name stays <code>wrapped</code> with cleared fuses; an expired emancipated or locked position exposes neither field. During the <code>.eth</code> registrar grace period the projected holder and operator powers keep only <code>approve</code> and <code>approve_wrapper</code>, then <code>CANNOT_APPROVE</code> applies. Wrapper state is not a summary of permissions; the registration-level <code>restrictions</code> object on <a href="#permissions">permissions(2)</a> carries the same wrapper fields plus <code>wrapper_expires_at</code>.</p>`) },
    { h: 'Field dictionary', id: 'dictionary', html: `<dl class="fields">
<dt>name, display_name</dt><dd>The normalized name and its display form.</dd>
<dt>namespace</dt><dd><code>ens</code> or <code>basenames</code>.</dd>
<dt>namehash, labelhash</dt><dd>The ENS namehash, and on subname rows the hash of the child label.</dd>
<dt>registration_id</dt><dd>An opaque handle for one registration lifecycle. For a <code>.eth</code> second-level name it is always the BaseRegistrar lease, whether or not the name is wrapped; if you stored a handle for a wrapped <code>.eth</code> name before this rule, read the name again.</dd>
<dt>token_id</dt><dd>The token ID as a decimal string.</dd>
<dt>owner, manager, registrant</dt><dd>The token or registry owner, the controller, and the registrant.</dd>
<dt>registered_at, created_at, expires_at</dt><dd>When the registration started, when the name was first observed, and when the registrar lease expires.</dd>
<dt>resolver</dt><dd><code>{chain_id, address}</code>.</dd>
<dt>addresses, text_records, content_hash</dt><dd>Convenience views over resolver records.</dd>
<dt>primary_name, primary_address, is_primary</dt><dd>The primary name for an address and coin type; the primary or default address for a name; whether a row is the selected primary.</dd>
<dt>relation, relations</dt><dd>The requested relation set and the subset that matched.</dd>
<dt>scope</dt><dd>The history scope: <code>name</code>, <code>registration</code>, or <code>both</code>.</dd>
<dt>grant_scope, powers, authority_context</dt><dd>The permission scope object, the effective powers, and whether the row is <code>current_for_name</code> or a <code>resource_audit</code>.</dd>
<dt>type, by_type</dt><dd>The product event category, and counts keyed by it.</dd>
<dt>block_number, block_hash, timestamp, transaction_hash, log_index</dt><dd>A position on an EVM chain.</dd>
<dt>subname_count, record_count</dt><dd>The number of direct subnames, and the number of known record keys.</dd>
<dt>capabilities</dt><dd>The capability summary of a namespace.</dd>
</dl>
<p>Pipeline terms such as <code>projection</code>, <code>manifest</code>, <code>logical_name_id</code>, <code>resource_id</code>, and <code>derivation_kind</code> appear only on the diagnostics routes.</p>` },
  ],
},
];

    { h: 'Which names an address result lists', html: `<p>An address page lists the names that are readable and supported and that are admitted by a readable, supported matching relation. Unsupported names are absent from the rows and from <code>total_count</code>. <a href="#address-names">addresses-names(2)</a> is looser: it can list a name whose relation is provable even when other coverage of that name has gaps.</p><p>A relation set that maps to one stored role group gets an exact <code>total_count</code>. A set that needs filtering after the query, meaning exactly <code>owner</code>, exactly <code>registrant</code>, or a partial set, keeps <code>total_count</code> at <code>null</code>, may scan several candidate batches, and can return a short page with <code>has_more</code> true.</p>` },

    sample: { data: { status: 'ready', pending_invalidation_count: 0, pending_invalidation_count_capped: false, dead_letter_count: 0, chains: { '1': { latest_block: 23400120, indexed_block: 23400118, safe_block: 23400090, finalized_block: 23400026, lag_blocks: 2, lag_seconds: 24, network_block: 23400121, network_head_observed_at: '2026-09-11T00:00:07Z', network_head_age_seconds: 3, network_head_status: 'fresh', ingestion_lag_blocks: 1, ingestion_lag_seconds: 12, status: 'ready' } } }, meta: {} },

  outcomes: [['200', 'Always, when the request is well formed. Readiness is in the body rather than in the HTTP status.'], ['400 invalid_input', 'Any query parameter at all.']],
  notes: [
    { h: 'How readiness is decided', html: `<dl class="fields">
<dt>ready</dt><dd>There is a completed publication matching this build's interpreter hash and the stored head hash, the lag is within <code>BIGNAME_API_STATUS_MAX_BLOCK_LAG</code> and <code>BIGNAME_API_STATUS_MAX_LAG_SECS</code>, the heartbeat is fresh, and the provider comparison is acceptable. A next pass that is already running does not disqualify the chain.</dd>
<dt>degraded</dt><dd>The phase is missing, paused, or redoing; an Interpret redo is active; the heartbeat is missing; the generation does not match; there is no completed publication; or the provider comparison is unavailable, stale, pending, or unconfigured while the lag is still acceptable.</dd>
<dt>stale</dt><dd>The projection phase failed; the heartbeat is older than <code>BIGNAME_API_PHASE_HEARTBEAT_MAX_AGE_SECS</code>, which defaults to 60 seconds; the lag is beyond its threshold; or the ingestion lag is beyond its threshold with a fresh comparison. Stale takes precedence over degraded.</dd>
</dl><p>Sepolia additionally needs a completed Ingest phase and a Verify phase at <code>quick_synced</code> or better. A failed provider refresh sets <code>network_head_status</code> to <code>unavailable</code> at once while keeping the last observed head as evidence. Without a phase schema the route answers an empty shape with status <code>degraded</code>.</p>` },
  ],
  related: ['healthz', 'namespace'],
},
{

  notes: [{ h: 'Which expiries are listed', html: '<p>This listing covers projected numeric registration lease expiries. Names with only a control expiry, no expiry, or unsupported current authority are omitted. An exact <a href="#name">name profile</a> can still expose an expiry outside this listing. Cursors bind the namespace, bounds, order, and current publication.</p>' }, { h: 'Released names stay listed', html: '<p>The listing means registrations whose expiry falls in the window, whether the registration is live, in grace or released. A released name keeps its old <code>expires_at</code>, so it appears in every window that covers it. Its row has <code>registration_status</code> <code>released</code> and no <code>owner</code> or <code>registrant</code>. The last holder of a released ENSv1 name is in <code>lapsed_registration</code> on its <a href="#name">name profile</a>, not on the listing row. To list only held names, filter rows on <code>registration_status</code>.</p>' }],

{

  params: [P.name, P.namespace, { name: 'source', in: 'query', type: 'enum', values: ['indexed', 'verified'], default: 'indexed', desc: 'With <code>verified</code>, the fields <code>addresses</code>, <code>text_records</code>, <code>content_hash</code>, and <code>primary_address</code> are rebuilt from live resolver calls. Everything else stays indexed. This route has no <code>auto</code>.' }, P.at, P.finality],
  response: {
    fields: [
      ['name, display_name, namespace, namehash, chain_id, network', 'Identity and the chain the name is served from.'],
      ['registration_id, token_id, owner, manager, registrant', 'The current registration. <code>manager</code> is omitted when there is none.'],
      ['registered_at, created_at, expires_at, registration_status', 'The registration lifecycle. See <a href="#vocabulary/lifecycle">vocab(7)</a>.'],
      ['lapsed_registration', 'Only on a released ENSv1 name: <code>{registrant, held_through, released_at}</code>, the holder the lease had when it lapsed and whether it was held through the <code>registrar</code> or the <code>wrapper</code>. For a wrapped name <code>registrant</code> is the NameWrapper token owner at the release, never the NameWrapper contract. <code>released_at</code> is the time of the block at which Bigname recorded the release, which is after <code>expires_at</code> plus the 90-day grace period. It is not current state and never lists the name under an address.'],
      ['wrapper_state, wrapper_fuses', 'The ENSv1 NameWrapper pair. See <a href="#vocabulary/wrapper">vocab(7)</a>.'],
      ['resolver', '<code>{chain_id, address}</code>. Omitted for unregistered names unless an ownerless ENSv1 or Basenames registry row, or an ENSv2 TLD with a current root-registry pointer and no projected authority, still carries a resolver pointer.'],
      ['addresses, text_records, content_hash, primary_name, primary_address', 'Convenience records. A map the index knows to be empty is <code>{}</code>.'],
      ['status, unsupported_reason, failure_reason, unsupported_fields', 'How the read went.'],
    ],
    sample: { data: { name: 'taytems.eth', display_name: 'taytems.eth', namespace: 'ens', namehash: '0x…', chain_id: 1, network: 'ethereum', registration_id: '…', token_id: '1234…', owner: '0x8e8d…3216', registrant: '0x8e8d…3216', registered_at: '2021-11-04T09:31:19Z', created_at: '2021-11-04T09:31:19Z', expires_at: '2031-11-04T09:31:19Z', registration_status: 'active', resolver: { chain_id: 1, address: '0x231b…f4d2' }, addresses: { '60': '0x8e8db5ccef88cca9d624701db544989c996e3216' }, text_records: { avatar: 'eip155:1/erc721:…', 'com.twitter': 'taytems' }, primary_address: '0x8e8db5ccef88cca9d624701db544989c996e3216', status: 'ok' }, meta: { ...AS_OF, source: 'indexed' } },
    alt: { label: 'a name whose registration has ended', sample: { data: { name: 'lapsed.eth', display_name: 'lapsed.eth', namespace: 'ens', namehash: '0x…', chain_id: 1, network: 'ethereum', registration_id: '…', registered_at: '2019-05-04T09:31:19Z', created_at: '2019-05-04T09:31:19Z', expires_at: '2020-05-04T09:31:19Z', registration_status: 'released', lapsed_registration: { registrant: '0x8e8d…3216', held_through: 'wrapper', released_at: '2020-08-02T09:31:35Z' }, status: 'ok' }, meta: { ...AS_OF, source: 'indexed' } } },

},
{
  id: 'records', method: 'GET', path: '/v1/names/{name}/records', title: 'Resolver records',
  summary: 'Returns resolver records for a name, one answer per requested key. The answers come from the index by default, from fresh resolver calls with <code>source=verified</code>, or from a mix of the two with <code>source=auto</code>.',
  keywords: ['keys', 'addr', 'text', 'avatar', 'contenthash', 'inventory', 'known_keys', 'unset_keys', 'unsupported_keys', 'auto', 'verified', 'ENSIP-19', 'default address'],
  sample: { name: 'taytems.eth', keys: 'addr:60,text:avatar,contenthash' },
  params: [P.name, P.namespace, { name: 'source', in: 'query', type: 'enum', values: ['indexed', 'verified', 'auto'], default: 'indexed', desc: '<code>auto</code> keeps indexed answers that satisfy a key and verifies the rest. With <code>keys</code> empty it stays indexed.' }, { name: 'keys', in: 'query', desc: 'Comma-separated selectors from <a href="#record-keys">record-keys(7)</a>. When omitted, the default set is derived from the name\'s inventory. Both an explicit and a derived set are capped at 200 keys.' }, { name: 'include', in: 'query', type: 'enum', values: ['inventory'], desc: 'Adds <code>inventory: {known_keys, unset_keys, unsupported_keys}</code> to the answer.' }, P.at, P.finality],
  response: {
    fields: [
      ['records.{key}', '<code>{status, value?, unsupported_reason?, failure_reason?, meta?}</code>. The <code>value</code> field is present only when the status is <code>ok</code>. An address derived under ENSIP-19 carries <code>meta: {basis, rule, source_record_key}</code>.'],
      ['resolver', 'The exact registry pointer, when it can be served.'],
      ['addresses, text_records, content_hash', 'Convenience views. Cleared values are omitted.'],
      ['inventory', 'Present with <code>include=inventory</code>. The audit-only inventory lives on <a href="#diag-records">diag-records(2)</a>.'],
      ['meta.source', '<code>indexed</code> or <code>verified</code>.'],
    ],
    sample: { data: { namespace: 'ens', resolver: { chain_id: 1, address: '0x231b…f4d2' }, addresses: { '60': '0x8e8db5ccef88cca9d624701db544989c996e3216' }, text_records: { avatar: 'eip155:1/erc721:…' }, content_hash: '0xe3010170…', records: { 'addr:60': { status: 'ok', value: '0x8e8db5ccef88cca9d624701db544989c996e3216' }, 'text:avatar': { status: 'ok', value: 'eip155:1/erc721:…' }, contenthash: { status: 'ok', value: '0xe3010170…' } } }, meta: { ...AS_OF, source: 'indexed' } },
    alt: { label: 'a key that is not set', sample: { data: { namespace: 'ens', resolver: { chain_id: 1, address: '0x231b…f4d2' }, addresses: { '60': '0x8e8db5ccef88cca9d624701db544989c996e3216' }, text_records: {}, records: { 'addr:60': { status: 'ok', value: '0x8e8db5ccef88cca9d624701db544989c996e3216' }, 'text:url': { status: 'not_found' } } }, meta: { ...AS_OF, source: 'indexed' } } },
  },
  outcomes: [['200', 'One answer per key. A miss or a failure is reported on the key it belongs to.'], ['400 invalid_input', 'The name is invalid, a selector is outside the grammar, or a parameter is unknown.'], ['404 not_found', 'The index has never observed this name.'], ['422 unsupported', 'The derived verified selector set is over 200 keys. Narrow it with <code>keys</code>.'], ['409 stale, 409 conflict', 'The snapshot cannot be served. See <a href="#errors">errors(7)</a>.'], ['500 internal_error', 'A provider transport failure.']],
  notes: [
    { h: 'What each source does', html: `<dl class="fields">
<dt>indexed</dt><dd>Reads the retained inventory. A miss is treated as authoritative only when the inventory is complete for the current resolver; otherwise the key reports <code>unsupported</code>.</dd>
<dt>verified</dt><dd>Makes fresh calls through the verification path admitted for the name's chain and selected authority, with a configured provider. ENS execution can use Mainnet or Sepolia; Basenames verification uses its declared Mainnet entrypoint. Results are not cached. Check the namespace capability report for this deployment.</dd>
<dt>auto</dt><dd>Keys with an exact indexed <code>ok</code> or an authoritative derived answer skip the provider; every other key is verified. A transport failure aborts the request.</dd>
</dl><p>A Basenames read with <code>auto</code> stays scoped to Base unless a verified fallback will be attempted. Inventory that is ahead of the chosen snapshot answers 409.</p>` },
    { h: 'Which writes count as current', html: `<p>Values follow the latest non-zero resolver selection and the latest record-version reset, and earlier writes on the selected resolver still count. A node-keyed write needs an attribution path on the same chain, node, and resolver: the ENSv1 registry, registrar, or wrapper pointers, or the Basenames registry pointer. When the current authority cannot be established, every source short-circuits with the same reason the name profile gives, except that <code>current_authority_not_projected</code> becomes <code>inventory_not_available</code>. Released names and ownerless ENSv2 reservations expose no records.</p>` },
    { h: 'Records this route does not serve', html: `<dl class="fields">
<dt>registry owner and resolver</dt><dd>On the name profile and in history.</dd>
<dt>reverse-claim names</dt><dd>On <a href="#primary-name">addresses-primary(2)</a>.</dd>
<dt>record versions, registry TTL</dt><dd>Not exposed on any public route.</dd>
<dt>ABI, pubkey, interface, DNS, legacy content, arbitrary data</dt><dd>Rejected with <code>400 invalid_input</code>.</dd>
</dl>` },
  ],
  related: ['name', 'diag-records', 'record-keys'],
},
{
  id: 'subnames', method: 'GET', path: '/v1/names/{name}/subnames', title: 'Subnames',

  keywords: ['children', 'labelhash', 'subname_count', 'counts', 'placeholder'],
  sample: { name: 'taytems.eth' },

    sample: { data: [ { name: 'pay.taytems.eth', display_name: 'pay.taytems.eth', namespace: 'ens', namehash: '0x…', labelhash: '0x…', owner: '0x8e8d…3216', registration_status: 'active', created_at: '2023-02-14T10:00:00Z' } ], page: { cursor: null, next_cursor: null, page_size: 50, total_count: null, has_more: false }, meta: { as_of: AS_OF.as_of } },

  outcomes: [['200', 'The children, or an empty page.'], ['400 invalid_input', 'The name is invalid, a parameter is unknown, or a snapshot selector was given.'], ['404 not_found', 'The parent is unknown.']],
  notes: [
    { h: 'Children whose label is unknown', html: `<p>When the label is unknown or cannot be normalized, <code>name</code> and <code>display_name</code> take the form <code>[&lt;labelhash without 0x&gt;].&lt;parent&gt;</code>. When the stored label is invalid UTF-8 or contains NUL, the whole name is given in PostgreSQL <code>escape</code> encoding. Neither form is reserved, so identify rows by <code>namehash</code> and <code>labelhash</code> and do not feed these strings into name routes. This applies to ENSv1 and Basenames only; an unnamed ENSv2 child is omitted.</p>` },
    { h: 'Children after a migration', html: `<p>A child appears once, under its own selected authority, and children whose authority is ambiguous are omitted. After a parent has migrated from ENSv1 to ENSv2, its ENSv1 children remain only along the <code>locked_wrapped</code> and <code>locked_child</code> paths, and only while they are migratable: no entry history in the migration registry, <code>PARENT_CANNOT_CONTROL</code> set, <code>IS_DOT_ETH</code> clear, and a non-zero ENSv1 owner.</p>` },
  ],
  related: ['name', 'history'],
},

  response: {

  notes: [
    { h: 'How this differs from a reverse lookup', html: `<p>This list can include a name whose relation is provable even when other coverage of that name is unsupported, and its rows carry no reason field. A name whose current authority cannot be proved is absent, which is why a migration removes superseded ENSv1 holders. With <code>include=role_summary</code>, any permission summary that is not full marks the response <code>partial</code> and lists <code>role_summary</code> in <code>meta.unsupported_fields</code>; the grants stay visible but are not exhaustive.</p>` },

{
  id: 'permissions', method: 'GET', path: '/v1/permissions', title: 'Permissions',
  summary: 'Lists who holds which powers over a name, a specific registration, or from the point of view of an address. Read <code>meta.completeness</code> before trusting an empty page, because some permission paths are not projected yet and the route says so rather than pretending the set is empty.',
  keywords: ['grant_scope', 'powers', 'authority_context', 'current_for_name', 'resource_audit', 'lineage', 'registration_control', 'record_manager'],
  sample: { name: 'taytems.eth' },
  params: [{ name: 'name', in: 'query', desc: 'Selects the name\'s current registration. At least one of <code>name</code>, <code>registration_id</code>, and <code>address</code> is required; they combine.' }, { name: 'registration_id', in: 'query', desc: 'Selects one registration explicitly, including a superseded one, for auditing.' }, { name: 'address', in: 'query', desc: 'Restricts rows to this permission subject.' }, P.namespace, { name: 'include', in: 'query', type: 'enum', values: ['lineage'], desc: 'Adds <code>lineage: {grant, revocation?, inheritance_path?, transfer_behavior?}</code> to each row.' }, P.cursor, P.pageSize, P.finalityLatest],
  response: {
    fields: [['address', 'The subject of the permission.'], ['grant_scope', '<code>{kind, detail}</code>. The kinds <code>root</code>, <code>registry</code>, and <code>registration</code> have an empty detail; <code>resolver</code> carries <code>{resolver: {chain_id, address}}</code>; <code>record_manager</code> carries <code>{chain_id, manager}</code>.'], ['powers', 'The effective powers. <code>registration_control</code> exposes the storage-level <code>resource_control</code>. <code>was_reserved</code> is a marker rather than a power.'], ['registration_id, name', 'The target registration and, when known, its display name.'], ['authority_context', '<code>current_for_name</code> when the row was selected through <code>name</code>, otherwise <code>resource_audit</code>.'], ['wrapper_state, wrapper_fuses', 'Present on current ENSv1 wrapper rows.'], ['lineage', 'Present with <code>include=lineage</code>. Its kinds are <code>event</code>, <code>permission</code>, <code>registration_authority</code>, <code>registration_rebound</code>, <code>ens_v1_authority</code>, <code>resolver_root_fallback</code>, and <code>registry_root_fallback</code>; a NameWrapper grant also names its <code>relation</code>: <code>holder</code>, <code>operator</code>, or <code>token_approval</code>.'], ['restrictions', 'Top level, beside <code>data</code>, on a read bound to a registration by <code>name</code> or <code>registration_id</code>: constraints on the registration itself. <code>kind</code> is <code>ens_v1_wrapper</code> with <code>wrapper_state</code>, <code>wrapper_fuses</code>, and <code>wrapper_expires_at</code>, or <code>ens_v2_registry</code> with <code>locked_roles</code>. Omitted for address-only reads, for registrations without a resource-level constraint model, for an expired emancipated or locked NameWrapper position, and once the wrapped token is burnt or unwrapped.']],
    sample: { data: [ { address: '0x8e8d…3216', grant_scope: { kind: 'registration', detail: {} }, powers: ['registration_control', 'transfer', 'set_resolver'], registration_id: '…', name: 'taytems.eth', authority_context: 'current_for_name' } ], page: { cursor: null, next_cursor: null, page_size: 50, total_count: null, has_more: false }, meta: { as_of: AS_OF.as_of, completeness: 'partial', unsupported_reason: 'approval_and_delegation_permissions_not_supported' } },
    alt: { label: 'an empty page whose emptiness is not proven', sample: { data: [], page: { cursor: null, next_cursor: null, page_size: 50, total_count: null, has_more: false }, meta: { as_of: AS_OF.as_of, completeness: 'partial', unsupported_reason: 'permission_support_unknown' } } },
  },
  outcomes: [['200', 'The rows, or an empty page whose <code>meta</code> says whether the emptiness is proven.'], ['400 invalid_input', 'No selector was given, the cursor is bad, a parameter is unknown, or a snapshot selector was given.'], ['422 unsupported', 'The filter combination is not supported.']],
  notes: [
    { h: 'What each selector returns', html: `<dl class="fields">
<dt>name, resolving to a supported current registration</dt><dd>Rows with <code>authority_context</code> set to <code>current_for_name</code>.</dd>
<dt>registration_id or address, without name</dt><dd>Rows with <code>authority_context</code> set to <code>resource_audit</code>.</dd>
<dt>the registration_id of a wrapped <code>.eth</code> name</dt><dd>A wrapped <code>.eth</code> name's <code>registration_id</code> is its BaseRegistrar lease. A read by that ID returns the rows of the NameWrapper resource that currently controls the name, each labelled with the lease's <code>registration_id</code>, also when the name was registered through the NameWrapper. <code>restrictions.registration_id</code> is the lease on every page, including an empty one.</dd>
<dt>the NameWrapper resource of a wrapped <code>.eth</code> name as registration_id</dt><dd>An empty page with no completeness metadata, with or without <code>address</code>. That resource is not a registration; read the name again for its <code>registration_id</code>. A wrapped subname has no lease, so its NameWrapper resource is its <code>registration_id</code> and selects its rows.</dd>
<dt>name together with a different registration_id</dt><dd>A proven-empty page with no completeness metadata.</dd>
<dt>a name that is missing, unsupported, or has no registration</dt><dd>An empty page marked <code>partial</code> with reason <code>permission_support_unknown</code>.</dd>
</dl><p>A migrated name selects only its ENSv2 permissions. The retained ENSv1 registration can be audited by ID but never becomes current again.</p>` },
    { h: 'How completeness is reported', html: `<dl class="fields">
<dt>the summary is missing or unrecognized</dt><dd><code>partial</code> with reason <code>permission_support_unknown</code>. This takes precedence over the others.</dd>
<dt>operator, approval, or delegation paths are not fully served</dt><dd><code>partial</code> with reason <code>approval_and_delegation_permissions_not_supported</code>.</dd>
<dt>the registration is an ENSv1 NameWrapper name</dt><dd><code>partial</code> with reason <code>parent_and_resolver_delegation_permissions_not_supported</code>. The holder, every operator it approved, and its per-token delegate are rows; the parent's control over a non-emancipated wrapped subname and resolver operator or delegate approvals are not, and the NameWrapper contract owner is a deployment-wide administrator rather than a per-registration permission.</dd>
<dt>the request selects by address alone</dt><dd>At least the approval and delegation partial, always.</dd>
</dl><p>Rows stay visible whatever the completeness. ENSv2 operator approval is not projected.</p>` },
    { h: 'NameWrapper rows', html: `<p>For a wrapped name the rows are the ERC-1155 holder, each account the holder approved with <code>setApprovalForAll</code> while that approval stands, and the address approved for the token with <code>approve</code>. Operators carry the holder's powers because NameWrapper authorizes both the same way; the token delegate carries only <code>extend_subname_expiry</code>. A burnt fuse removes the matching power from all of them, and rows disappear on transfer, unwrap, approval revocation, and expiry.</p>` },
  ],
  related: ['address-names', 'name', 'diag-authority'],
},

    };
    const width = (v, n) => (Math.max(v.length, n.length, 3) + 1) + 'ch';
    const field = p => {
      const v = vals[p.name] || '';
      if (p.values) return `<select name="${esc(p.name)}" aria-label="${esc(p.name)}">${p.values.map(x => `<option${x === v ? ' selected' : ''}>${esc(x)}</option>`).join('')}</select>`;
      return `<input name="${esc(p.name)}" value="${esc(v)}" style="width:${width(v, p.name)}" spellcheck="false" autocomplete="off" autocapitalize="off" aria-label="${esc(p.name)}">`;
    };
    function render() {
      const full = withPrefix(r.path), pfx = full.startsWith(PREFIX + '/') ? PREFIX : '';
      let u = (pfx ? `<span class="pfx">${esc(pfx)}</span>` : '') + esc(full.slice(pfx.length)).replace(/\{([a-z_]+)\}/g, (_, n) => byName(n) ? field(byName(n)) : `{${n}}`);
      let first = true;
      for (const p of params) { if (p.in === 'path' || !shown.has(p.name)) continue; u += `<i>${first ? '?' : '&amp;'}</i>${esc(p.name)}<i>=</i>${field(p)}`; first = false; }
      const adds = params.filter(p => p.in !== 'path' && !shown.has(p.name)).map(p => `<button type="button" data-add="${esc(p.name)}">${esc(p.name)}</button>`).join('');
      form.innerHTML = `<div class="line"><span class="m">${esc(r.method)}</span><span class="u">${u}</span><span class="go"><button type="button" class="cp">curl</button><button type="submit" class="run">run</button></span></div>${adds ? `<div class="adds">${adds}</div>` : ''}${r.method === 'POST' ? `<div class="body-in"><textarea name="__body" spellcheck="false" aria-label="request body">${esc(body)}</textarea></div>` : ''}`;
    }
    render();
    form.addEventListener('input', e => {
      const t = e.target;
      if (t.name === '__body') { body = t.value; return; }
      if (!t.name) return;
      vals[t.name] = t.value;
      if (t.tagName === 'INPUT') t.style.width = width(t.value, t.name);
      const p = byName(t.name); if (p && p.in === 'path') remember(t.name, t.value);
    });
    // an emptied query parameter leaves the line when you move on
    form.addEventListener('focusout', e => {
      const p = byName(e.target.name);
      if (!p || p.in === 'path' || (vals[p.name] || '').trim()) return;
      shown.delete(p.name); delete vals[p.name];
      const next = e.relatedTarget && e.relatedTarget.name;
      render();
      if (next && form.elements[next]) form.elements[next].focus();
    });
    form.addEventListener('click', e => {
      const add = e.target.closest('[data-add]');
      if (add) { const p = byName(add.dataset.add); shown.add(p.name); vals[p.name] = p.values ? (p.default || p.values[0]) : ''; render(); const f = form.elements[p.name]; if (f) f.focus(); return; }
      const cp = e.target.closest('.cp');
      if (cp) navigator.clipboard.writeText(curlFor(r, url(), body)).then(() => { cp.textContent = 'copied'; setTimeout(() => cp.textContent = 'curl', 1200); });
    });
    out.addEventListener('click', e => {
      const sw = e.target.closest('.sw'); if (sw) { out.className = 'out ex'; out.innerHTML = exampleHtml(r, sw.dataset.which); }
      if (e.target.closest('.ex-back')) { out.className = 'out ex'; out.innerHTML = exampleHtml(r, 'main'); }
    });
    form.addEventListener('submit', async e => {
      e.preventDefault();
      const u = url(), btn = $('.run', form);
      btn.disabled = true; out.hidden = false; out.className = 'out';
      out.innerHTML = `<div class="oh">${MARK.replace('class="mark"', 'class="mark busy" style="height:14px;width:auto"')}<span>asking ${esc(location.host)}</span></div><pre> </pre>`;
      const t0 = performance.now();
      try {
        const init = { method: r.method, headers: { accept: 'application/json' } };
        if (r.method === 'POST') { init.headers['content-type'] = 'application/json'; init.body = body; }
        const res = await fetch(u, init);
        const ms = Math.round(performance.now() - t0), text = await res.text();
        let pretty = text; try { pretty = JSON.stringify(JSON.parse(text), null, 2); } catch (err) {}
        const why = outcomeText(r, res.status);
        const back = r.response && r.response.sample ? '<span class="sp"><button type="button" class="ex-back">example</button></span>' : '';
        out.innerHTML = `<div class="oh"><span class="chip${res.ok ? '' : ' pink'}">${res.status}</span><span>${ms} ms · ${text.length} bytes</span>${back}</div>${why ? `<p class="why">${why}</p>` : ''}<pre>${hlJson(pretty)}</pre>`;
      } catch (err) {
        out.innerHTML = `<div class="oh"><span class="chip pink">no answer</span><span>${Math.round(performance.now() - t0)} ms</span></div><p class="why" style="padding-bottom:12px">Nothing answered at ${esc(location.origin)}. This page is served by the API itself, so open it from a running bigname to run requests.</p>`;
      } finally { btn.disabled = false; }
    });
  }

  // ---- routing --------------------------------------------------------
  function show(id) {
    const e = BY_ID[id] || BY_ID.overview;
    document.body.classList.toggle('at', !!BY_ID[id]);
    setCurrent(e.id);
    $('#page').innerHTML = `<a class="back" href="#">&larr; ${esc(PREFIX)}</a>` + (e.kind === 'route' ? routeHtml(e) : guideHtml(e));
    document.title = e.id === 'overview' ? 'bigname API docs' : `${nameOf(e)} · bigname API docs`;
    if (e.kind === 'route') wireRequest(e);
  }
  function route() {
    const [id, anchor] = decodeURIComponent(location.hash.replace(/^#\/?/, '')).split('/');
    show(id);
    const target = anchor && document.getElementById('sec-' + anchor);
    if (target) target.scrollIntoView({ block: 'start' }); else scrollTo(0, 0);
  }
  addEventListener('hashchange', route);
  addEventListener('keydown', e => { if (e.key === 'Escape' && matchMedia('(max-width: 860px)').matches && !e.target.closest('input,textarea,select')) location.hash = ''; });

  // ---- theme and status ----------------------------------------------
  const THEME_KEY = 'bigname-docs-theme';
  const pref = () => { try { const v = localStorage.getItem(THEME_KEY); return v === 'dark' ? 'ink' : v === 'light' ? 'quartz' : v; } catch (e) { return null; } };
  function applyTheme() {
    const p = pref(), name = p === 'ink' || p === 'quartz' ? p : (matchMedia('(prefers-color-scheme: dark)').matches ? 'ink' : 'quartz');
    document.documentElement.setAttribute('data-theme', name);
    $('#theme-btn').title = name === 'ink' ? 'switch to paper' : 'switch to ink';
  }
  $('#theme-btn').addEventListener('click', () => { const ink = document.documentElement.getAttribute('data-theme') === 'ink'; try { localStorage.setItem(THEME_KEY, ink ? 'quartz' : 'ink'); } catch (e) {} document.documentElement.classList.add('no-tr'); applyTheme(); setTimeout(() => document.documentElement.classList.remove('no-tr'), 80); });
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);
  applyTheme();

  async function probe(prefix) {
    try { const r = await fetch(prefix + '/status', { headers: { accept: 'application/json' } }); if (!r.ok) return null; const j = await r.json(); return j && j.data && j.data.status ? j.data : null; } catch (e) { return null; }
  }
  const fmtLag = s => s < 90 ? `${Math.round(s)}s` : s < 5400 ? `${Math.round(s / 60)}m` : `${(s / 3600).toFixed(1)}h`;
  async function loadStatus(first) {
    const el = $('#status'), t = $('.t', el);
    let d = await probe(PREFIX);
    if (!d && first) for (const alt of ['/v2', '/v1']) { if (alt === PREFIX) continue; d = await probe(alt); if (d) { PREFIX = alt; renderIndex(); route(); break; } }
    if (!d) { el.className = 'status bad'; t.textContent = 'index unreachable'; el.title = `GET ${PREFIX}/status did not answer from this origin`; return; }
    const chains = Object.entries(d.chains || {});
    const lag = chains.map(([, c]) => c.lag_seconds).filter(x => typeof x === 'number');
    el.className = 'status ' + (d.status === 'ready' ? 'ok' : d.status === 'stale' ? 'bad' : '');
    t.textContent = `index ${d.status}${lag.length ? `, ${fmtLag(Math.max(...lag))} behind` : ''}`;
    el.title = chains.map(([id, c]) => `chain ${id}: ${c.status}, indexed ${c.indexed_block ?? '?'} of ${c.latest_block ?? '?'}`).join('\n');
  }

  renderIndex();
  $('#ver').textContent = dev ? 'bigname dev' : `bigname ${VERSION} · ${BUILD_SHA.slice(0, 10)}`;
  route();
  loadStatus(true); setInterval(() => loadStatus(false), 30000);
})();
</script>
</body>
</html>
