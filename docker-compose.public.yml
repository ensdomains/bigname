name: bigname

services:
  public-proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: ${BIGNAME_LOG_MAX_SIZE:-100m}
        max-file: "${BIGNAME_LOG_MAX_FILE:-5}"
    deploy:
      resources:
        limits:
          memory: ${BIGNAME_PUBLIC_PROXY_MEMORY_LIMIT:?set BIGNAME_PUBLIC_PROXY_MEMORY_LIMIT}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${BIGNAME_PUBLIC_HTTP_PORT:-80}:80"
      - "${BIGNAME_PUBLIC_HTTPS_PORT:-443}:443"
      - "${BIGNAME_PUBLIC_HTTPS_PORT:-443}:443/udp"
    environment:
      BIGNAME_PUBLIC_SITE_ADDRESS: ${BIGNAME_PUBLIC_SITE_ADDRESS:-:80}
      BIGNAME_PUBLIC_UPSTREAM: ${BIGNAME_PUBLIC_UPSTREAM:-api:3000}
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:
