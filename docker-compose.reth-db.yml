services:
  api:
    networks:
      - default
      - eth_archive_node

  phase-runner:
    networks:
      - default
      - eth_archive_node
    volumes:
      - type: bind
        source: ${RETH_DATA_DIR:?set RETH_DATA_DIR to the host's canonical reth database directory}
        target: ${RETH_DATA_DIR:?set RETH_DATA_DIR to the in-container canonical reth database directory}
        read_only: true


networks:
  eth_archive_node:
    external: true
    name: eth-archive-node_default
