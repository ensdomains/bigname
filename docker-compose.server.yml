name: bigname

x-bigname-env: &bigname-env
  BIGNAME_DATABASE_URL: ${BIGNAME_DATABASE_URL:-postgresql://bigname:bigname@postgres:5432/bigname}
  BIGNAME_DATABASE_MAX_CONNECTIONS: ${BIGNAME_DATABASE_MAX_CONNECTIONS:-10}
  RUST_LOG: ${RUST_LOG:-info,sqlx::query=error}

x-bigname-service: &bigname-service
  image: ${BIGNAME_IMAGE:-ghcr.io/ensdomains/bigname:latest}
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    shm_size: ${POSTGRES_SHM_SIZE:-8gb}
    command:
      - postgres
      - -c
      - shared_buffers=${POSTGRES_SHARED_BUFFERS:-8GB}
      - -c
      - effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-96GB}
      - -c
      - maintenance_work_mem=${POSTGRES_MAINTENANCE_WORK_MEM:-1GB}
      - -c
      - work_mem=${POSTGRES_WORK_MEM:-16MB}
      - -c
      - wal_buffers=${POSTGRES_WAL_BUFFERS:-64MB}
      - -c
      - max_wal_size=${POSTGRES_MAX_WAL_SIZE:-32GB}
      - -c
      - min_wal_size=${POSTGRES_MIN_WAL_SIZE:-4GB}
      - -c
      - checkpoint_timeout=${POSTGRES_CHECKPOINT_TIMEOUT:-15min}
      - -c
      - checkpoint_completion_target=${POSTGRES_CHECKPOINT_COMPLETION_TARGET:-0.9}
      - -c
      - wal_compression=${POSTGRES_WAL_COMPRESSION:-on}
      - -c
      - effective_io_concurrency=${POSTGRES_EFFECTIVE_IO_CONCURRENCY:-256}
      - -c
      - random_page_cost=${POSTGRES_RANDOM_PAGE_COST:-1.1}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bigname}
      POSTGRES_USER: ${POSTGRES_USER:-bigname}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bigname}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-bigname} -d ${POSTGRES_DB:-bigname}
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  api:
    <<: *bigname-service
    command: api
    ports:
      - "${BIGNAME_API_HOST:-127.0.0.1}:${BIGNAME_API_PORT:-3000}:3000"
      - "${BIGNAME_API_METRICS_HOST:-127.0.0.1}:${BIGNAME_API_METRICS_PORT:-9464}:9464"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *bigname-env
      BIGNAME_DATABASE_URL: ${BIGNAME_API_DATABASE_URL:?set BIGNAME_API_DATABASE_URL to the non-owner API login}
      BIGNAME_API_BIND_ADDR: ${BIGNAME_API_BIND_ADDR:-0.0.0.0:3000}
      BIGNAME_API_METRICS_BIND_ADDR: ${BIGNAME_API_METRICS_BIND_ADDR:-0.0.0.0:9464}
      BIGNAME_API_CHAIN_RPC_URLS: ${BIGNAME_API_CHAIN_RPC_URLS:-}
      BIGNAME_API_PHASE_HEARTBEAT_MAX_AGE_SECS: ${BIGNAME_API_PHASE_HEARTBEAT_MAX_AGE_SECS:-60}
      BIGNAME_API_STATUS_PROVIDER_TIMEOUT_MS: ${BIGNAME_API_STATUS_PROVIDER_TIMEOUT_MS:-750}
      BIGNAME_API_STATUS_PROVIDER_REFRESH_SECS: ${BIGNAME_API_STATUS_PROVIDER_REFRESH_SECS:-5}
      BIGNAME_API_STATUS_PROVIDER_CACHE_TTL_SECS: ${BIGNAME_API_STATUS_PROVIDER_CACHE_TTL_SECS:-30}
      BIGNAME_API_STATUS_MAX_BLOCK_LAG: ${BIGNAME_API_STATUS_MAX_BLOCK_LAG:-30}
      BIGNAME_API_STATUS_MAX_LAG_SECS: ${BIGNAME_API_STATUS_MAX_LAG_SECS:-60}
      BIGNAME_API_LOOKUP_BATCH_LIMIT: ${BIGNAME_API_LOOKUP_BATCH_LIMIT:-1000}
      BIGNAME_API_REQUEST_TIMEOUT_MS: ${BIGNAME_API_REQUEST_TIMEOUT_MS:-30000}
      BIGNAME_API_DB_STATEMENT_TIMEOUT_MS: ${BIGNAME_API_DB_STATEMENT_TIMEOUT_MS:-25000}
      BIGNAME_API_MAX_IN_FLIGHT: ${BIGNAME_API_MAX_IN_FLIGHT:-1024}
      BIGNAME_API_HEALTH_MAX_IN_FLIGHT: ${BIGNAME_API_HEALTH_MAX_IN_FLIGHT:-4}
      BIGNAME_API_VERIFIED_EXECUTION_MAX_IN_FLIGHT: ${BIGNAME_API_VERIFIED_EXECUTION_MAX_IN_FLIGHT:-128}
      BIGNAME_API_RPC_CONNECT_TIMEOUT_MS: ${BIGNAME_API_RPC_CONNECT_TIMEOUT_MS:-2000}
      BIGNAME_API_RPC_TIMEOUT_MS: ${BIGNAME_API_RPC_TIMEOUT_MS:-8000}
      BIGNAME_API_VERIFIED_RATE_LIMIT_PER_SECOND: ${BIGNAME_API_VERIFIED_RATE_LIMIT_PER_SECOND:-0}
      BIGNAME_API_VERIFIED_RATE_LIMIT_BURST: ${BIGNAME_API_VERIFIED_RATE_LIMIT_BURST:-10}
      BIGNAME_API_VERIFIED_RATE_LIMIT_MAX_CLIENTS: ${BIGNAME_API_VERIFIED_RATE_LIMIT_MAX_CLIENTS:-65536}
      BIGNAME_API_TRUST_X_FORWARDED_FOR: ${BIGNAME_API_TRUST_X_FORWARDED_FOR:-false}
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS "http://127.0.0.1:$${BIGNAME_API_BIND_ADDR##*:}/healthz" | grep -q '"api_status":"ready"'
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
  phase-runner:
    <<: *bigname-service
    command: phases
    ports:
      - "${BIGNAME_PHASE_RUNNER_METRICS_HOST:-127.0.0.1}:${BIGNAME_PHASE_RUNNER_METRICS_PORT:-9465}:9465"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *bigname-env
      BIGNAME_PHASE_RUNNER_MANIFESTS_ROOT: ${BIGNAME_PHASE_RUNNER_MANIFESTS_ROOT:-/app/manifests/mainnet}
      BIGNAME_PHASE_RUNNER_INTERPRETER_STATE_CACHE_ENTRIES: ${BIGNAME_PHASE_RUNNER_INTERPRETER_STATE_CACHE_ENTRIES:-65536}
      BIGNAME_PHASE_RUNNER_VERIFICATION_DATABASE_URL: ${BIGNAME_PHASE_RUNNER_VERIFICATION_DATABASE_URL:?set BIGNAME_PHASE_RUNNER_VERIFICATION_DATABASE_URL to the SELECT-only verifier login}
      BIGNAME_PHASE_RUNNER_METRICS_BIND_ADDR: ${BIGNAME_PHASE_RUNNER_METRICS_BIND_ADDR:-0.0.0.0:9465}
      BIGNAME_PHASE_RUNNER_HEARTBEAT_STALE_AFTER_SECS: ${BIGNAME_PHASE_RUNNER_HEARTBEAT_STALE_AFTER_SECS:-900}
      BIGNAME_PHASE_RUNNER_CHAINS: ${BIGNAME_PHASE_RUNNER_CHAINS:?set BIGNAME_PHASE_RUNNER_CHAINS}
      BIGNAME_PHASE_RUNNER_SOURCES: ${BIGNAME_PHASE_RUNNER_SOURCES:?set BIGNAME_PHASE_RUNNER_SOURCES}
      BIGNAME_PHASE_RUNNER_HYDRATION_RPC_URLS: ${BIGNAME_PHASE_RUNNER_HYDRATION_RPC_URLS:-}
      BIGNAME_PHASE_RUNNER_INSTANCE_ID: ${BIGNAME_PHASE_RUNNER_INSTANCE_ID:-phase-runner}
      RETH_DATA_DIR: ${RETH_DATA_DIR:-}

volumes:
  postgres-data:
