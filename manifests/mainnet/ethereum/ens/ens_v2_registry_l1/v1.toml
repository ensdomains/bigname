# Each registry keeps its own ERC-1155 owner-to-operator approvals, and an approved operator
# gets the roles the current token owner holds on a token's own resource.
# (upstream: .refs/ens_v2_mainnet_20261002/contracts/src/erc1155/ERC1155Singleton.sol:L73-L75 @ ens_v2_mainnet_20261002@b1f97b91)
# (upstream: .refs/ens_v2_mainnet_20261002/contracts/src/registry/PermissionedRegistry.sol:L622-L636 @ ens_v2_mainnet_20261002@b1f97b91)
# A standard approval declaration: the list stays empty and the adapter maps the event to
# AccountPermissionChanged. It is an ordinary family-wide event, so discovered user and
# ENSv1→ENSv2 migration-created registries are watched as well as the declared ETHRegistry.
# start_block bounds the family-wide watch entry of the compiled watch plan, and so the Ingest
# redo that adding this event requires. It is a bigname coverage decision, not a deployment
# fact: 26105621 is the declared ETHRegistry's start. No mainnet manifest admitted an ENSv2
# registry before this one, so no retained `RegistryCreated` lowers the announcement watch below
# the declared ETHRegistry. The RootRegistry that the 2026-10-13 redeploy replaced announced
# itself at 26105295. Runtime intake fetches that announcement, so it is indexed as a registry
# that names nothing (docs/mainnet-deployment.md, "Replaced contracts"). docs/manifests.md,
# "Watch-plan expansion", says how to re-derive the value.
# (upstream: .refs/ens_v2_mainnet_20261002/contracts/deployments/mainnet-root-20261013/RootRegistry.json:L2 @ ens_v2_mainnet_20261002@b1f97b91)
# (upstream: .refs/ens_v2_mainnet_20261002/contracts/deployments/mainnet-root-20261013/RootRegistry.json:L2995 @ ens_v2_mainnet_20261002@b1f97b91)
# (upstream: .refs/ens_v2_mainnet_20261002/contracts/deployments/mainnet/ETHRegistry.json:L362 @ ens_v2_mainnet_20261002@b1f97b91)
# (upstream: .refs/ens_v2_mainnet_20261002/contracts/deployments/mainnet/UserRegistryImpl.json:L425 @ ens_v2_mainnet_20261002@b1f97b91)
# (upstream: .refs/ens_v2_mainnet_20261002/contracts/deployments/mainnet/WrapperRegistryImpl.json:L520 @ ens_v2_mainnet_20261002@b1f97b91)
[[abi.events]]
name = "ApprovalForAll"
fragment = "event ApprovalForAll(address indexed account, address indexed operator, bool approved)"
emitter_roles = ["registry"]
normalized_events = []
start_block = 26105621
