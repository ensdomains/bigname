# Official 2026-10-02 mainnet ENSv2 deployment, as the pinned deployments/mainnet folder lists it.
# No manifest declares the contracts that the 2026-10-13 and 2026-10-18 redeploys replaced
# (docs/mainnet-deployment.md).
# (upstream: .refs/ens_v2_mainnet_20261002/contracts/deployments/mainnet/.deployment.json:L4 @ ens_v2_mainnet_20261002@b1f97b91)
# Every event that compiles a family-wide or all-emitter watch entry starts at 26105621, the
# declared ETHRegistry's start and this family's first declaration. The start bounds the Ingest
# redo that admitting these events stamps and the first-effect scan of that change, not runtime
# intake. Event blocks are part of the interpreter content hash, so the Interpret and Project
# redo that follow run over the full range (docs/manifests.md, "Mandatory historical fetch after
# watch-plan widening").
manifest_version = 1
namespace = "ens"
source_family = "ens_v2_registry_l1"
chain = "ethereum-mainnet"
deployment_epoch = "ens_v2_mainnet_20261002"
rollout_status = "active"
normalizer_version = "ensip15@ens-normalize-0.1.1"

[capability_flags]
declared_children = { status = "supported", notes = "selected official mainnet ETHRegistry and discovered user registries are authoritative declared child inputs" }

