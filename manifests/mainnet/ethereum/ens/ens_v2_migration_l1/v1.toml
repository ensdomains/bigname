# Constructor argument 1 (`nameWrapper`) of both declared migration controllers, and argument 7 of
# the official ETHRenewerV1, fix the ENSv1 NameWrapper whose events are correlated. It is the
# mainnet ENSv1 NameWrapper deployment. This is correlation metadata, not a watched contract.
