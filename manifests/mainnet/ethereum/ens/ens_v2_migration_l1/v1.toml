# (upstream: .refs/ens_v2_mainnet_20261002/contracts/deployments/mainnet/ETHRenewerV1.json:L949 @ ens_v2_mainnet_20261002@b1f97b91)
# (upstream: .refs/ens_v1/deployments/mainnet/NameWrapper.json:L2 @ ens_v1@91c966f)
# The unlocked controller and the Graveyard read their BaseRegistrar from
# `nameWrapper.registrar()`, which the mainnet NameWrapper fixed at construction (constructor
