# (upstream: .refs/ens_v1/deployments/mainnet/NameWrapper.json:L1503-L1507 @ ens_v1@91c966f)
# (upstream: .refs/ens_v1/deployments/mainnet/BaseRegistrarImplementation.json:L2 @ ens_v1@91c966f)
[correlation_addresses]
