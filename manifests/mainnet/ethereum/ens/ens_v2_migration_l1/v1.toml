# BaseRegistrar logs are attributed by ens_v1_registrar_l1; this value does not widen the watch plan.
# (upstream: .refs/ens_v2_mainnet_20261002/contracts/src/migration/UnlockedMigrationController.sol:L66 @ ens_v2_mainnet_20261002@b1f97b91)
