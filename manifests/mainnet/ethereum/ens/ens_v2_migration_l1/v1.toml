# ABI layout:
# (upstream: .refs/ens_v2_mainnet_20261002/contracts/deployments/mainnet/VerifiableFactory.json:L48 @ ens_v2_mainnet_20261002@b1f97b91)
# Meaning the interpreter relies on: `sender` is the contract that called the factory and `salt` is
# the migrated name's namehash. The receiver passes `uint256(node)` as the salt after checking the
# node is the name's namehash, and the factory emits `ProxyDeployed(msg.sender, proxy, salt, ...)`
# (the build-info line holds the factory's whole source from this deployment's compiler input).
# (upstream: .refs/ens_v2_mainnet_20261002/contracts/src/migration/LockedWrapperReceiver.sol:L117-L121 @ ens_v2_mainnet_20261002@b1f97b91)
# (upstream: .refs/ens_v2_mainnet_20261002/contracts/src/migration/LockedWrapperReceiver.sol:L156-L160 @ ens_v2_mainnet_20261002@4f47cbcc)
# (upstream: .refs/ens_v2_mainnet_20261002/contracts/deployments/mainnet/VerifiableFactory.json:L156 @ ens_v2_mainnet_20261002@b1f97b91)
# (upstream: .refs/ens_v2_mainnet_20261002/contracts/deployments/mainnet/build-info/solc-0_8_25-b30e6dc9a03b37f6a0b89af5d02a73d3993944f7.json:L1564 @ ens_v2_mainnet_20261002@b1f97b91)
[[abi.events]]
name = "ProxyDeployed"
fragment = "event ProxyDeployed(address indexed sender, address indexed proxyAddress, uint256 salt, address implementation)"
emitter_roles = ["verifiable_factory"]
normalized_events = ["ContractDiscovered"]

# (upstream: .refs/ens_v2_mainnet_20261002/contracts/deployments/mainnet/ETHRenewerV1.json:L156 @ ens_v2_mainnet_20261002@b1f97b91)
[[abi.events]]
name = "NameRenewed"
fragment = "event NameRenewed(uint256 indexed tokenId, string label, uint64 duration, uint64 newExpiry, address paymentToken, bytes32 indexed referrer, uint256 amount)"
emitter_roles = ["ens_v1_renewal_bridge"]
normalized_events = ["RegistrationRenewed", "PreimageObserved"]
