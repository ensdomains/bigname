# Shadow-scoped bootstrap for the canonical ENS execution entrypoint on Ethereum Sepolia.
# This is the Sepolia deployment profile's counterpart of
# manifests/mainnet/ethereum/ens/ens_execution/v1.toml: the same Universal Resolver
# proxy address, the same role, the same shadow-scoped verified-resolution ownership.
# The proxy address is pinned by the admitted 2026-06-29 Sepolia deployment artifact,
# which deploys the ENS Universal Resolver proxy at this address
# (upstream: .refs/ens_v2/contracts/deployments/sepolia-20260629-r1/UpgradableUniversalResolverProxy.json:L2 @ ens_v2@a971bd64);
# the later non-admitted redeploy keeps the same proxy address
# (upstream: .refs/ens_v2/contracts/deployments/sepolia/UpgradableUniversalResolverProxy.json:L2 @ ens_v2@a971bd64).
# The pinned ENSv1 Sepolia UniversalResolver deployment is the implementation/ABI
# anchor, as on Mainnet; the lookup entry is the proxy address
# (upstream: .refs/ens_v1/deployments/sepolia/UniversalResolver.json:L2 @ ens_v1@91c966f).
manifest_version = 1
namespace = "ens"
source_family = "ens_execution"
chain = "ethereum-sepolia"
deployment_epoch = "ens_v1"
rollout_status = "shadow"
normalizer_version = "ensip15@ens-normalize-0.1.1"
roots = []
discovery_rules = []

[capability_flags]
verified_resolution = { status = "shadow", notes = "shadow execution ownership on the Sepolia deployment profile; verified records and verified ENS/60 primary-name lookup execute through this entrypoint under the same rules as Mainnet" }

[[contracts]]
role = "universal_resolver"
address = "0xeEeEEEeE14D718C2B47D9923Deab1335E144EeEe"
proxy_kind = "none"
