# Bootstrap seed for the canonical ENS reverse registrars on Ethereum Sepolia.
manifest_version = 1
namespace = "ens"
source_family = "ens_v1_reverse_l1"
chain = "ethereum-sepolia"
deployment_epoch = "ens_v1"
rollout_status = "active"
normalizer_version = "ensip15@ens-normalize-0.1.1"
roots = []
discovery_rules = []

[capability_flags]

# Address from the ENSv1 Sepolia deployment artifact.
# (upstream: .refs/ens_v1/deployments/sepolia/ReverseRegistrar.json:L2 @ ens_v1@91c966f)
[[contracts]]
role = "reverse_registrar"
address = "0xA0a1AbcDAe1a2a4A2EF8e9113Ff0e02DD81DC0C6"
proxy_kind = "none"
# Start block follows the Sepolia deployment transaction.
# (upstream: .refs/ens_v1/deployments/sepolia/ReverseRegistrar.json:L352 @ ens_v1@91c966f).
start_block = 3789411

# The ENSIP-19 default.reverse registrar (coin type 2147483648).
# (upstream: .refs/ens_v1/deployments/sepolia/DefaultReverseRegistrar.json:L2 @ ens_v1@91c966f)
# (upstream: .refs/ens_v1/contracts/utils/ENSIP19.sol:L10 @ ens_v1@91c966f)
[[contracts]]
role = "default_reverse_registrar"
address = "0x4F382928805ba0e23B30cFB75fC9E848e82DFD47"
proxy_kind = "none"
# Start block follows the Sepolia deployment receipt.
# (upstream: .refs/ens_v1/deployments/sepolia/DefaultReverseRegistrar.json:L270 @ ens_v1@91c966f).
start_block = 8579966

# The reverse registrar emits the claimed address and reverse node together:
# (upstream: .refs/ens_v1/contracts/reverseRegistrar/ReverseRegistrar.sol:L23 @ ens_v1@91c966f).
[[abi.events]]
name = "ReverseClaimed"
fragment = "event ReverseClaimed(address indexed addr, bytes32 indexed node)"
emitter_roles = ["reverse_registrar"]
normalized_events = ["ReverseChanged"]

# Every setter of the default registrar stores the address's name and emits it:
# (upstream: .refs/ens_v1/contracts/reverseRegistrar/IStandaloneReverseRegistrar.sol:L10 @ ens_v1@91c966f)
# (upstream: .refs/ens_v1/contracts/reverseRegistrar/StandaloneReverseRegistrar.sol:L28-L31 @ ens_v1@91c966f)
# (upstream: .refs/ens_v1/contracts/reverseRegistrar/DefaultReverseRegistrar.sol:L26-L57 @ ens_v1@91c966f).
[[abi.events]]
name = "NameForAddrChanged"
fragment = "event NameForAddrChanged(address indexed addr, string name)"
emitter_roles = ["default_reverse_registrar"]
normalized_events = ["ReverseChanged", "RecordChanged"]
