# ENSv1 Sepolia PublicResolver source-family admission. The four contracts are
# the complete first-party app known-resolver list for Sepolia:
# (upstream: .refs/ens_app_v3/src/constants/resolverAddressData.ts:L149-L221 @ ens_app_v3@7175858).
# Reverse resolvers, ExtendedDNSResolver / OffchainDNSResolver, UniversalResolver,
# and the TLD-level OwnedResolver are outside this family.
#
# Resolver compatibility claims remain intentionally narrower than latest PublicResolver
# compatibility: unsupported interfaces and features are not inferred from
# newer generations unless a role-specific resolver profile admits them.
manifest_version = 1
namespace = "ens"
source_family = "ens_v1_resolver_l1"
chain = "ethereum-sepolia"
deployment_epoch = "ens_v1"
rollout_status = "active"
normalizer_version = "ensip15@ens-normalize-0.1.1"

roots = []
discovery_rules = []

[capability_flags]

[[contracts]]
# Latest ENS Labs resolver; wrapper-aware. This generation composes AddrResolver,
# and the app metadata records its default coin-type support.
# (upstream: .refs/ens_v1/contracts/resolvers/PublicResolver.sol:L20-L31 @ ens_v1@91c966f).
# (upstream: .refs/ens_v1/contracts/resolvers/profiles/AddrResolver.sol:L68-L85 @ ens_v1@91c966f).
# (upstream: .refs/ens_app_v3/src/constants/resolverAddressData.ts:L151-L166 @ ens_app_v3@7175858).
role = "public_resolver"
address = "0xE99638b40E4Fff0129D56f03b55b6bbC4BBE49b5"
proxy_kind = "none"
read_features = ["ensip19_default_address"]
# Receipt-backed deployment start.
# (upstream: .refs/ens_v1/deployments/sepolia/PublicResolver.json:L1091-L1107 @ ens_v1@91c966f).
start_block = 8580001

