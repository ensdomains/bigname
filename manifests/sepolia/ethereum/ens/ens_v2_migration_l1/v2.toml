# ABI layout:
# (upstream: .refs/ens_v2_sepolia_20261001/contracts/deployments/sepolia/VerifiableFactory.json:L48 @ ens_v2_sepolia_20261001@07e55a05)
# Meaning the interpreter relies on: `sender` is the contract that called the factory and `salt` is
# the migrated name's namehash. The receiver passes `uint256(node)` as the salt after checking the
# node is the name's namehash, and the factory emits `ProxyDeployed(msg.sender, proxy, salt, ...)`
# (the build-info line holds the factory's whole source from this deployment's compiler input).
