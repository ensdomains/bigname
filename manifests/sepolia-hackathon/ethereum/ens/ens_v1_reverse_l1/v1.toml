# Separate Sepolia hackathon candidate. Address/start provenance and qualifications:
# docs/manifests.md section "Sepolia hackathon deployment evidence".
# Source citations below establish ABI layouts only, not deployment addresses.
#
# The hackathon deployment's own ENSv1 ReverseRegistrar: it owns `addr.reverse` in the
# hackathon ENSv1 registry 0x82080cc8... (its constructor argument), and its
# `defaultResolver()` is the declared `public_resolver` 0xaec512a7... of the hackathon
# `ens_v1_resolver_l1` manifest. Created at block 11626578 by
# 0x506f2f6e792f6b9ce9f3d79dbd0a9e19ea0a27ed1de0147415e83daea1a24d9e from the deployer EOA
# 0x84d3a426d4e12e955d1df95db0b24fe26afe39d3 (archive-node receipt; see the docs section).
manifest_version = 1
namespace = "ens"
source_family = "ens_v1_reverse_l1"
chain = "ethereum-sepolia"
deployment_epoch = "ens_v1_sepolia_hackathon"
rollout_status = "active"
normalizer_version = "ensip15@ens-normalize-0.1.1"
roots = []
discovery_rules = []

[capability_flags]

[[contracts]]
role = "reverse_registrar"
address = "0x060D5a54a8751eEc63B756E32Ef66f5eEf418e60"
proxy_kind = "none"
start_block = 11626578

# The reverse registrar emits the claimed address and reverse node together, then writes the
# `<addr>.addr.reverse` subnode record into its ENS registry and, for `setName`, calls the
# selected resolver's `setName`; the resolver's `NameChanged` is intake for `ens_v1_resolver_l1`.
# (upstream: .refs/ens_v1/contracts/reverseRegistrar/ReverseRegistrar.sol:L23 @ ens_v1@91c966f)
# (upstream: .refs/ens_v1/contracts/reverseRegistrar/ReverseRegistrar.sol:L83-L84 @ ens_v1@91c966f)
# (upstream: .refs/ens_v1/contracts/reverseRegistrar/ReverseRegistrar.sol:L105-L113 @ ens_v1@91c966f)
# (upstream: .refs/ens_v1/contracts/reverseRegistrar/ReverseRegistrar.sol:L129-L130 @ ens_v1@91c966f)
[[abi.events]]
name = "ReverseClaimed"
fragment = "event ReverseClaimed(address indexed addr, bytes32 indexed node)"
emitter_roles = [ "reverse_registrar" ]
normalized_events = [ "ReverseChanged" ]
