# Separate Sepolia hackathon candidate. Shadow-scoped ENS execution entrypoint for the
# `sepolia-hackathon` deployment profile: the hackathon deployment's own ENS Universal
# Resolver proxy, not the canonical Sepolia proxy that manifests/sepolia declares. The
# canonical proxy `0xeEeEEEeE14D718C2B47D9923Deab1335E144EeEe` resolves to an implementation
# that does not embed the hackathon root registry, so it cannot answer for names under
# `0xe7f0D5724f8337e3Aa9A9910540341Ff4273fEd9`.
# Address/start provenance and qualifications: docs/manifests.md section "Sepolia hackathon
# deployment evidence" (external-evidence admission exception; ensjs hackathon build
# `ensUniversalResolver` for Sepolia, creation receipts read from an archive node). The
# declared address is the ERC-1967 proxy created at block 11626766; its `Upgraded` chain
# (proxy -> managed proxy 0x1abed09f1f36383f27cf0b3a5e0ea1738e1fd921 -> implementation
# 0xfea8d4b7fcce0b8765c793d6695eac384aaa458f) is recorded there as provenance only. The
# lookup entry is the proxy address; no implementation is declared because the table
# records deployment and inclusion, not proxy activation intervals.
# Source citations below establish ABI layouts only, not deployment addresses: the lookup
# engine calls `resolve(bytes,bytes)` in the pinned Universal Resolver interface layout
# (upstream: .refs/ens_v1/contracts/universalResolver/IUniversalResolver.sol:L55 @ ens_v1@91c966f),
# with the pinned ENSv1 Sepolia UniversalResolver deployment as the ABI anchor, as on Sepolia
# (upstream: .refs/ens_v1/deployments/sepolia/UniversalResolver.json:L2 @ ens_v1@91c966f).
manifest_version = 1
namespace = "ens"
source_family = "ens_execution"
chain = "ethereum-sepolia"
deployment_epoch = "ens_v2_sepolia_hackathon"
rollout_status = "shadow"
normalizer_version = "ensip15@ens-normalize-0.1.1"
roots = []
discovery_rules = []

[capability_flags]
verified_resolution = { status = "shadow", notes = "shadow execution ownership on the separately evidenced sepolia-hackathon deployment profile; verified records and verified ENS/60 primary-name lookup execute through the hackathon deployment's own Universal Resolver under the same rules as Mainnet and Sepolia" }

[[contracts]]
role = "universal_resolver"
address = "0xd26f2040d083af1cd2962ba303f4bea0c4faf142"
proxy_kind = "none"
start_block = 11626766
