groups:
  - name: bigname-phase-runner
    rules:
      - alert: BignamePhaseFailed
        expr: phase_runner_phase_status{job="bigname-phase-runner",status="failed"} == 1
        labels:
          severity: page
        annotations:
          threshold: "A phase reports status=failed on one evaluation."
          meaning: "The named chain phase stored an error; it may be retrying or may have stopped."

      - alert: BignamePhaseRunnerDown
        expr: up{job="bigname-phase-runner"} == 0
        for: 2m
        labels:
          severity: page
        annotations:
          threshold: "Prometheus cannot scrape the runner for 2 minutes."
          meaning: "The runner process or metrics listener has remained continuously unavailable; brief successful scrapes reset this alert."

      - alert: BignamePhaseRunnerContainerRestarting
        expr: |
          changes(
            phase_runner_process_start_timestamp_milliseconds{
              job="bigname-phase-runner"
            }[10m]
          ) >= 3
        labels:
          severity: page
        annotations:
          threshold: "The runner process-start value changes at least 3 times within 10 minutes."
          meaning: "The runner is repeatedly restarting, including failures that happen before phase state can be recorded."

      - alert: BignamePhaseRunnerHeartbeatThresholdMissing
        expr: |
          up{job="bigname-phase-runner"} == 1
          unless on (job, instance)
          phase_runner_heartbeat_stale_threshold_seconds{
            job="bigname-phase-runner"
          }
        for: 2m
        labels:
          severity: page
        annotations:
          threshold: "The configured heartbeat threshold metric is absent for 2 minutes."
          meaning: "The runner image and alert rules are incompatible, so heartbeat-age paging cannot be evaluated safely."

      - alert: BignamePhaseRunnerLoopHeartbeatMissing
        expr: |
          (
            up{job="bigname-phase-runner"} == 1
            unless on (job, instance)
            phase_runner_loop_heartbeat_age_seconds{
              job="bigname-phase-runner"
            }
          )
          and on (job, instance)
          phase_runner_heartbeat_stale_threshold_seconds{
            job="bigname-phase-runner"
          }
        for: 2m
        labels:
          severity: page
        annotations:
          threshold: "The runner-loop heartbeat metric is absent for 2 minutes."
          meaning: "The runner image predates the loop-liveness rule, so between-phase stalls cannot be evaluated safely."

      - alert: BignamePhaseRunnerHeartbeatStale
        expr: |
          (
            (
              (
                phase_runner_heartbeat_age_seconds{
                  job="bigname-phase-runner"
                } < bool 0
              )
              * on (job, instance) group_left (threshold_seconds)
              topk by (job, instance) (
                1,
                phase_runner_heartbeat_stale_threshold_seconds{
                  job="bigname-phase-runner"
                }
              )
            ) > 0
            or
            (
              phase_runner_heartbeat_age_seconds{job="bigname-phase-runner"}
              > on (job, instance) group_left (threshold_seconds)
              topk by (job, instance) (
                1,
                phase_runner_heartbeat_stale_threshold_seconds{
                  job="bigname-phase-runner"
                }
              )
            )
          )
          and on (job, instance, chain, phase)
          phase_runner_phase_status{
            job="bigname-phase-runner",status=~"running|paused"
          } == 1
        for: 2m
        labels:
          severity: page
        annotations:
          threshold: "A running or capacity-paused phase has no heartbeat, or its heartbeat is older than the configured {{ $labels.threshold_seconds }} seconds, for 2 minutes."
          meaning: "The named chain phase is no longer completing work often enough to prove that it is alive."

      - alert: BignamePhaseRunnerHeadLagHigh
        expr: |
          (
            max_over_time(
              phase_runner_head_lag_blocks{
                job="bigname-phase-runner",phase="live"
              }[2m]
            ) > 30
          )
          and on (job, instance, chain, phase)
          (
            max_over_time(
              phase_runner_phase_status{
                job="bigname-phase-runner",phase="live",status="running"
              }[2m]
            ) == 1
          )
        for: 10m
        labels:
          severity: page
        annotations:
          threshold: "Live lag exceeds 30 blocks and Live is observed running at least once in every 2-minute window for 10 minutes."
          meaning: "The named chain is persistently falling behind new blocks."

      - alert: BignamePhaseRunnerLoopStale
        expr: |
          phase_runner_loop_heartbeat_age_seconds{
            job="bigname-phase-runner"
          }
          > on (job, instance) group_left (threshold_seconds)
          topk by (job, instance) (
            1,
            phase_runner_heartbeat_stale_threshold_seconds{
              job="bigname-phase-runner"
            }
          )
        for: 2m
        labels:
          severity: page
        annotations:
          threshold: "The runner loop for the named chain makes no observable progress for the configured {{ $labels.threshold_seconds }} seconds, plus 2 minutes."
          meaning: "The runner is scrapeable, but its loop for the named chain is wedged between phase work opportunities."

      - alert: BignamePhaseRunnerMetricsRefreshStale
        expr: |
          phase_runner_metrics_refresh_success{job="bigname-phase-runner"} == 0
          or
          time() - phase_runner_metrics_last_refresh_timestamp_seconds{
            job="bigname-phase-runner"
          } > 60
        for: 2m
        labels:
          severity: page
        annotations:
          threshold: "The metrics database read fails, or no successful refresh occurs for 60 seconds, for 2 minutes."
          meaning: "The endpoint is reachable but its view of pipeline state is no longer current."
