# A test still running after 12 minutes is killed and reported as TIMEOUT. The slowest test on
# CI takes under 4 minutes. Every profile inherits this.
[profile.default]
slow-timeout = { period = "60s", terminate-after = 12 }

# CI's api shards run with `--profile ci`. Each shard writes its per-test times to
# target/nextest/ci/junit.xml, which the workflow uploads.
[profile.ci]
fail-fast = false

[profile.ci.junit]
path = "junit.xml"

# The load_admissions scaling test prints its timings and query plans, the announced registry
# chain test prints its phase runs, and the long resolver DNS name tests print their wall times.
# A passing test's output is hidden by default, so this shows theirs in the log.
[[profile.default.overrides]]
filter = 'test(admissions_scaling) | test(announced_registry_chain) | test(long_resolver_dns_name)'
success-output = "immediate"
